<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Контакти | Boxing 12×3</title>
<meta name="description" content="Зв'яжіться з командою Boxing 12×3 – суддівська картка боксерських боїв.">
<link rel="canonical" href="https://boxing12x3.com/contact">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='14' fill='%23111'/%3E%3Ctext x='50' y='38' font-family='Georgia,serif' font-size='36' font-weight='700' fill='white' text-anchor='middle'%3E12%3C/text%3E%3Cline x1='18' y1='52' x2='82' y2='52' stroke='%23c0392b' stroke-width='3'/%3E%3Ctext x='50' y='72' font-family='Georgia,serif' font-size='30' font-weight='700' fill='white' text-anchor='middle' letter-spacing='3'%3E%C3%973%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,400;0,500;0,700&display=swap" rel="stylesheet">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ContactPage",
  "name": "Контакти Boxing 12×3",
  "url": "https://boxing12x3.com/contact",
  "publisher": {"@type": "Organization", "name": "Boxing 12×3", "url": "https://boxing12x3.com",
    "email": "contact@boxing12x3.com"}
}
</script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--red:#c0392b;--bg:#f7f6f3;--card:#fff;--text:#1a1a1a;--muted:#888;--border:#e5e3de;--r:10px;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);padding:1.5rem 1rem 4rem;line-height:1.7;}
.wrap{max-width:620px;margin:0 auto;}
.lang-row{display:flex;justify-content:flex-end;gap:4px;margin-bottom:1rem;}
.lang-btn{font-size:11px;font-weight:500;padding:4px 10px;border-radius:20px;border:0.5px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;text-decoration:none;}
.lang-btn.on{background:var(--text);color:#fff;border-color:var(--text);}
.brand{text-align:center;margin-bottom:2rem;}
.brand a{text-decoration:none;}
.brand-name{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:.12em;color:var(--text);margin:0;}
.brand-sub{font-size:10px;color:var(--muted);letter-spacing:.18em;text-transform:uppercase;margin-top:1px;}
.section{background:var(--card);border:0.5px solid var(--border);border-radius:var(--r);padding:24px;margin-bottom:16px;}
.section-label{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:14px;}
p{font-size:15px;color:#2a2a2a;margin-bottom:12px;line-height:1.7;}
p:last-child{margin-bottom:0;}
.email-link{display:inline-block;font-size:16px;font-weight:600;color:var(--red);text-decoration:none;margin-top:4px;}
.back{text-align:center;margin-top:28px;}
.back a{font-size:13px;color:var(--red);font-weight:500;text-decoration:none;}
.site-footer{text-align:center;padding:24px 0 8px;font-size:12px;color:var(--muted);}
.site-footer a{color:var(--muted);text-decoration:none;margin:0 6px;}
@media (hover: hover) and (pointer: fine) {
  .email-link:hover{opacity:.8;}
  .back a:hover{opacity:.8;}
  .site-footer a:hover{color:var(--red);}
}
@media (prefers-reduced-motion: reduce) {
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important;}
}
</style>
</head>
<body>
<div class="wrap">

  <div class="lang-row">
    <span class="lang-btn on" id="btn-ua" onclick="setLang('ua')">UA</span>
    <span class="lang-btn" id="btn-en" onclick="setLang('en')">EN</span>
  </div>

  <div class="brand">
    <a href="/">
      <h1 class="brand-name">BOXING 12×3</h1>
      <div class="brand-sub" id="brand-sub">Суддівська картка</div>
    </a>
  </div>

  <div class="section">
    <div class="section-label" id="lbl-contact">Зв'язок</div>
    <p id="contact-desc">З питань співпраці, реклами або будь-яких інших звертайтесь:</p>
    <a class="email-link" href="mailto:contact@boxing12x3.com">contact@boxing12x3.com</a>
  </div>

  <div class="section">
    <div class="section-label" id="lbl-social">Соцмережі</div>
    <p id="social-desc">Підписуйтесь на оновлення:</p>
    <p><a href="https://t.me/boxing12x3" target="_blank" rel="noopener" style="color:var(--red);font-weight:500;text-decoration:none;">Telegram @boxing12x3 →</a></p>
  </div>

  <div class="back"><a href="/" id="link-home">← На головну</a></div>
  <div class="site-footer">
    <a href="/" id="footer-home">Головна</a>
    <a href="/about" id="footer-about">Про проєкт</a>
    <a href="/privacy">Privacy Policy</a>
  </div>

</div>
<script>
var t = {
  ua: {
    'brand-sub': 'Суддівська картка',
    'lbl-contact': "Зв'язок",
    'contact-desc': 'З питань співпраці, реклами або будь-яких інших звертайтесь:',
    'lbl-social': 'Соцмережі',
    'social-desc': 'Підписуйтесь на оновлення:',
    'link-home': '← На головну',
    'footer-home': 'Головна',
    'footer-about': 'Про проєкт'
  },
  en: {
    'brand-sub': 'Scorecard',
    'lbl-contact': 'Contact',
    'contact-desc': 'For partnership, advertising or any other enquiries:',
    'lbl-social': 'Social',
    'social-desc': 'Follow for updates:',
    'link-home': '← Home',
    'footer-home': 'Home',
    'footer-about': 'About'
  }
};
function setLang(lang) {
  var data = t[lang];
  for (var id in data) {
    var el = document.getElementById(id);
    if (el) el.textContent = data[id];
  }
  document.getElementById('btn-ua').className = 'lang-btn' + (lang === 'ua' ? ' on' : '');
  document.getElementById('btn-en').className = 'lang-btn' + (lang === 'en' ? ' on' : '');
  document.querySelector('.brand a').href = lang === 'en' ? '/?lang=en' : '/';
}
</script>
</body>
</html>
