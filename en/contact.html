<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--red:#c0392b;--bg:#f7f6f3;--card:#fff;--text:#1a1a1a;--muted:#888;--border:#e5e3de;--r:10px;}

.brand{text-align:center;margin-bottom:2rem;}

.brand-sub{font-size:10px;color:var(--muted);letter-spacing:.18em;text-transform:uppercase;margin-top:1px;}
.section{background:var(--card);border:0.5px solid var(--border);border-radius:var(--r);padding:24px;margin-bottom:16px;}
.section-label{margin-top:0;font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:14px;}
p{font-size:15px;color:#2a2a2a;margin-bottom:12px;line-height:1.7;}
p:last-child{margin-bottom:0;}
.email-link{display:inline-block;font-size:16px;font-weight:600;color:var(--red);text-decoration:none;margin-top:4px;}
.back{text-align:center;margin-top:28px;}
.back a{font-size:13px;color:var(--red);font-weight:500;text-decoration:none;}
.site-footer{text-align:center;padding:24px 0 8px;font-size:12px;color:var(--muted);}
.site-footer a{color:var(--muted);text-decoration:none;margin:0 6px;}
@media (hover: hover) and (pointer: fine) {
  .email-link:hover{opacity:.8;}
  .back a:hover{opacity:.8;}
  .site-footer a:hover{color:var(--red);}
}
@media (prefers-reduced-motion: reduce) {
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important;}
