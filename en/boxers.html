<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--red:#c0392b;--bg:#f7f6f3;--card:#fff;--text:#1a1a1a;--muted:#888;--border:#e5e3de;--r:10px;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);padding:1.5rem 1rem 4rem;line-height:1.6;}
.wrap{max-width:620px;margin:0 auto;}
.lang-row{display:flex;justify-content:flex-end;gap:4px;margin-bottom:1rem;}
.lang-btn{font-size:11px;font-weight:500;padding:4px 10px;border-radius:20px;border:0.5px solid var(--border);background:transparent;color:var(--muted);text-decoration:none;}
.lang-btn.on{background:var(--text);color:#fff;border-color:var(--text);}
.brand{text-align:center;margin-bottom:1.5rem;}
.brand a{text-decoration:none;}
.brand-name{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:.12em;color:var(--text);font-weight:700;}
.brand-sub{font-size:10px;color:var(--muted);letter-spacing:.18em;text-transform:uppercase;margin-top:1px;}
h1{font-size:22px;font-weight:700;margin-bottom:6px;}
.page-sub{font-size:13px;color:var(--muted);margin-bottom:24px;padding-bottom:20px;border-bottom:0.5px solid var(--border);}
.div-block{margin-bottom:8px;}
.div-header{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:0.5px solid var(--border);border-radius:var(--r);padding:13px 16px;cursor:pointer;user-select:none;transition:background .15s;}
.div-header:hover{background:#f0ede8;}
.div-header.open{border-bottom-left-radius:0;border-bottom-right-radius:0;border-bottom-color:transparent;}
.div-title{font-size:14px;font-weight:600;}
.div-count{font-size:12px;color:var(--muted);}
.div-arr{font-size:16px;color:var(--muted);transition:transform .2s;}
.div-header.open .div-arr{transform:rotate(90deg);}
.div-body{display:none;background:var(--card);border:0.5px solid var(--border);border-top:none;border-bottom-left-radius:var(--r);border-bottom-right-radius:var(--r);overflow:hidden;}
.div-body.open{display:block;}
.boxer-link{display:flex;align-items:center;justify-content:space-between;padding:11px 16px;border-top:0.5px solid var(--border);text-decoration:none;color:var(--text);font-size:13px;font-weight:500;transition:background .15s;}
.boxer-link:first-child{border-top:none;}
.boxer-link:hover{background:var(--bg);}
.boxer-name{display:flex;align-items:center;gap:8px;}
.boxer-chip{font-size:9px;font-weight:700;color:#fff;padding:2px 6px;border-radius:3px;}
.boxer-arr{font-size:14px;color:var(--muted);}
.back{text-align:center;margin-top:28px;}
.back a{font-size:13px;color:var(--red);font-weight:500;text-decoration:none;}
.site-footer{text-align:center;padding:24px 0 8px;font-size:12px;color:var(--muted);}
.site-footer a{color:var(--muted);text-decoration:none;}
.site-footer a:hover{color:var(--red);}
</style>

// Division order and names - per our weight-class reference table.
const DIV_ORDER = ['hw','cw','lhw','smw','mw','sww','ww','slw','lw','sfw','fw','sbw','bw','sfl','fl','lfl','mfw'];
const DIV_NAMES_EN = {mfw:'Minimumweight',lfl:'Light Flyweight',fl:'Flyweight',sfl:'Super Flyweight',bw:'Bantamweight',sbw:'Super Bantamweight',fw:'Featherweight',sfw:'Super Featherweight',lw:'Lightweight',slw:'Super Lightweight',ww:'Welterweight',sww:'Super Welterweight',mw:'Middleweight',smw:'Super Middleweight',lhw:'Light Heavyweight',cw:'Cruiserweight',hw:'Heavyweight'};

// ── Render ────────────────────────────────────────────────────────────────
function build() {
  var groups = {};
  BOXER_PROFILES.forEach(function(p){ (groups[p.div] = groups[p.div] || []).push(p); });
  var divs = DIV_ORDER.filter(function(d){ return groups[d] && groups[d].length; });
  if (!divs.length) return;
  var openDiv = divs.reduce(function(best, d){ return groups[d].length > groups[best].length ? d : best; }, divs[0]);

  var container = document.getElementById('catalog');
  divs.forEach(function(d, idx) {
    var id = 'div-' + d;
    var isOpen = d === openDiv;
    var block = document.createElement('div');
    block.className = 'div-block';
    block.innerHTML =
      '<div class="div-header' + (isOpen ? ' open' : '') + '" onclick="toggle(\'' + id + '\')">' +
        '<h2 class="div-title">' + DIV_NAMES_EN[d] + '</h2>' +
        '<span style="display:flex;align-items:center;gap:10px;">' +
          '<span class="div-count">' + groups[d].length + ' boxer' + (groups[d].length !== 1 ? 's' : '') + '</span>' +
          '<span class="div-arr">›</span>' +
        '</span>' +
      '</div>' +
      '<div class="div-body' + (isOpen ? ' open' : '') + '" id="' + id + '">' +
        groups[d].map(function(p) {
          return '<a class="boxer-link" href="/en/boxers/' + p.slug + '">' +
            '<span class="boxer-name">' + p.name +
              (p.org ? ' <span class="boxer-chip" style="background:' + p.orgColor + '">' + p.org + '</span>' : '') +
            '</span>' +
            '<span class="boxer-arr">›</span>' +
          '</a>';
        }).join('') +
      '</div>';
    container.appendChild(block);
  });
}

function toggle(id) {
  var body = document.getElementById(id);
  var header = body.previousElementSibling;
  body.classList.toggle('open');
  header.classList.toggle('open');
}

build();
