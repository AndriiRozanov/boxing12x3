<script>
var DAYS = [
{d:1,events:[
{y:1888,t:"Packey McFarland was born",p:"",x:"Packey McFarland (real name Patrick McFarland) was an outstanding American professional boxer of the early 20th century. He fought at lightweight and welterweight. He is considered one of the best fighters in the history of the sport who never held an official world title (the political situation in boxing at the time and the champions' refusal to fight him got in the way). He had over 100 bouts in his career and suffered very few defeats."},
{y:1897,t:"Jack Johnson KO 2 Charley Brooks",p:"Galveston, USA",x:"Debut for both boxers. Bout for the Texas state middleweight title. Johnson later became the first African American heavyweight world champion (1908), sparking a revolution in the sport."},
{y:1978,t:"Bermane Stiverne was born",p:"",x:"Bermane Stiverne is a Haitian-Canadian professional boxer and former WBC heavyweight world champion (2014-2015). Stiverne made history as the first fighter from Haiti to win a world title in the heavyweight division. He lost the title in a bout with Deontay Wilder."},
{y:2002,t:"Oscar Larios KO 1 Willie Jorrin",p:"Sacramento, USA",x:"Larios won the WBC super bantamweight title by knocking out Jorrin in the very first round. It was a rematch after a decision loss in 2001."},
{y:2003,t:"<a class='boxer-link' href='/en/boxers/floyd-mayweather-jr'>Floyd Mayweather</a> TKO 7 Phillip N'Dou",p:"Grand Rapids, USA",x:"Mayweather defended his WBC and The Ring lightweight titles with a stoppage victory in the seventh round. At the time of the stoppage Floyd was ahead on all three judges' scorecards: twice 59-54 and 60-52."},
{y:2008,t:"<a class='boxer-link' href='/en/boxers/vic-darchinyan'>Vic Darchinyan</a> KO 9 Cristian Mijares",p:"California, USA",v:"jZ9zYn40Xog",x:"Darchinyan unified the WBC, WBA and IBF super flyweight titles."}
]},
{d:3,events:[
{y:1899,t:"James Jeffries UD 25 Tom Sharkey",p:"Coney Island, Brooklyn, USA",x:"Jeffries defended the world heavyweight title, beating Sharkey on a decision after 25 rounds in their first meeting. The Ring later called this bout one of the most brutal in the early history of boxing."},
{y:1984,t:"Jose Luis Ramirez TKO 4 Edwin Rosario",p:"San Juan, Puerto Rico",x:"Ramirez won the WBC lightweight title in the rematch, knocking out Rosario in the fourth round. The Ring named this bout its \"Fight of the Year\". Edwin was unbeaten going into the rematch."}
]},
{d:4,events:[
{y:1995,t:"<a class='boxer-link' href='/en/boxers/riddick-bowe'>Riddick Bowe</a> TKO 8 <a class='boxer-link' href='/en/boxers/evander-holyfield'>Evander Holyfield</a>",p:"Las Vegas, USA",x:"At the time of the stoppage Holyfield was ahead on all three judges' scorecards, 66-65."},
{y:2006,t:"Floyd Mayweather UD 12 Carlos Baldomir",p:"Las Vegas, USA",x:"Bout for the WBC world welterweight title. Floyd won on a decision: twice 120-108 and 118-110."}
]},
{d:5,events:[
{y:1994,t:"<a class='boxer-link' href='/en/boxers/george-foreman'>George Foreman</a> KO 10 Michael Moorer",p:"Las Vegas, USA",x:"Foreman set a historic record, becoming the oldest world champion in heavyweight history at 45 years and 299 days."}
]},
{d:6,events:[
{y:1981,t:"<a class='boxer-link' href='/en/boxers/larry-holmes'>Larry Holmes</a> TKO 11 Renaldo Snipes",p:"Pittsburgh, USA",x:"Holmes defended the WBC heavyweight title, knocking Snipes out in the eleventh round even though he had been down in the seventh."},
{y:1993,t:"Evander Holyfield MD 12 Riddick Bowe",p:"Las Vegas, USA",x:"Rematch, billed \"Repeat or Revenge\", for the WBA and IBF heavyweight world titles. The night also went down in boxing history for one of its strangest incidents: in the 7th round a stunt parachutist, James \"Fan Man\" Miller, landed in the ring, and the fight was halted for 21 minutes. In the first fight Bowe handed Holyfield the first defeat of his career. In the rematch Holyfield took his revenge in an extremely tense contest. The judges' scores: 114-114, 115-114 and 115-113 in favour of Evander."}
]},
{d:7,events:[
{y:1970,t:"<a class='boxer-link' href='/en/boxers/carlos-monzon'>Carlos Monzon</a> TKO 12 Nino Benvenuti",p:"Rome, Italy",x:"Bout for the world middleweight title (WBC and WBA). The Argentine knockout puncher Carlos Monzon made a sensational conquering trip to Europe, brutally stopping the reigning Italian champion Nino Benvenuti in the 12th round. The fight was named the best bout of 1970 by The Ring."},
{y:1988,t:"Sugar Ray Leonard TKO 9 Donny Lalonde",p:"Las Vegas, USA",x:"Bout for the WBC super middleweight and light heavyweight titles. Leonard was knocked down in the 4th round."}
]},
{d:8,events:[
{y:1997,t:"Evander Holyfield RTD 8 Michael Moorer",p:"Las Vegas, USA",x:"Bout for the WBA and IBF heavyweight titles. For Holyfield it was the first fight after his two bouts with Mike Tyson."}
]},
{d:9,events:[
{y:1996,t:"Evander Holyfield TKO 11 <a class='boxer-link' href='/en/boxers/mike-tyson'>Mike Tyson</a>",p:"Las Vegas, USA",x:"Bout for the WBA world heavyweight title. Mike Tyson entered the ring as the overwhelming favourite, but the veteran Evander Holyfield defied all predictions with perfect tactics, clinches and resilience. Holyfield dominated throughout, and in the 11th round he rocked his opponent and referee Mitch Halpern stopped the fight. Tyson suffered a shocking early defeat and Holyfield became a three-time world champion.",img:{src:"/images/history/holyfield-tyson-compare.png",alt:"Height comparison of Mike Tyson and Evander Holyfield",cta:"Compare the height of Tyson and Holyfield - and any other boxers, active or retired",href:"/en/height-compare?a=tyson&b=holyfield"}}
]},
{d:10,events:[
{y:1983,t:"<a class='boxer-link' href='/en/boxers/marvin-hagler'>Marvin Hagler</a> UD 15 <a class='boxer-link' href='/en/boxers/roberto-duran'>Roberto Duran</a>",p:"Las Vegas, USA",v:"50gRxreUjYw",x:"Defence of the undisputed world middleweight title (WBC, WBA and IBF). Roberto Duran moved up in weight and gave the formidable champion an incredible, competitive fight. Hagler took the win on a unanimous decision: 144-142, 143-142 and 146-139."},
{y:2001,t:"Floyd Mayweather RTD 9 Jesus Chavez",p:"San Francisco, USA",x:"Bout for the WBC super featherweight title."},
{y:2006,t:"Evander Holyfield UD 12 Fres Oquendo",p:"San Antonio, USA",x:"Bout for the IBF USBA heavyweight title."},
{y:2012,t:"<a class='boxer-link' href='/en/boxers/wladimir-klitschko'>Wladimir Klitschko</a> UD 12 Mariusz Wach",p:"Hamburg, Germany",x:"The first defeat in the career of the Polish heavyweight."}
]},
{d:11,events:[
{y:2000,t:"<a class='boxer-link' href='/en/boxers/lennox-lewis'>Lennox Lewis</a> UD 12 <a class='boxer-link' href='/en/boxers/david-tua'>David Tua</a>",p:"Las Vegas, USA",x:"Bout for the IBF, WBC and IBO heavyweight titles. Lewis took the win on a decision: 118-110, 119-109 and 117-111. The referee was Joe Cortez."},
{y:2006,t:"Wladimir Klitschko TKO 7 Calvin Brock",p:"New York, USA",x:"The first defeat in Brock's career. A successful defence of the IBF and IBO belts for Klitschko."}
]},
{d:13,events:[
{y:1982,t:"Ray Mancini KO 14 Duk Koo Kim",p:"Las Vegas, USA",x:"Mancini defended the WBA lightweight title, knocking out the Korean challenger in the 14th round in an extremely brutal slugfest. A tragic moment in boxing history: Kim fell into a coma and died five days later from a head injury. The event changed the rules of world boxing. As a result, title fights were limited to 12 rounds instead of 15."},
{y:1999,t:"Lennox Lewis UD 12 Evander Holyfield",p:"Las Vegas, USA",v:"2xJK7_zX1H8",x:"Bout for the undisputed heavyweight championship. Rematch: the first fight, earlier that year in the spring, ended in a draw."},
{y:2004,t:"Larry Donald UD 12 Evander Holyfield",p:"New York, USA",x:"Holyfield's third defeat in a row. At that point he had not won since 2002. Before this he had lost to Chris Byrd on a decision and to James Toney by a technical knockout in the 9th round."}
]},
{d:15,events:[
{y:1984,t:"Evander Holyfield UD 6 Lionel Byarm",p:"New York, USA",x:"Evander Holyfield's professional debut. As an amateur he won an Olympic bronze medal in 1984."},
{y:1997,t:"Roberto Duran UD 8 Dave Radford",p:"Gauteng, South Africa",x:""},
{y:2014,t:"Wladimir Klitschko KO 5 <a class='boxer-link' href='/en/height-compare?a=pulev'>Kubrat Pulev</a>",p:"Hamburg, Germany",x:"The first defeat in Pulev's career. Bout for the WBA Super, IBF, WBO, IBO and The Ring titles."},
{y:2024,t:"Jake Paul UD 8 Mike Tyson",p:"Arlington, USA (AT&T Stadium)",x:"The return of a legend after a long break, in a bout with two-minute rounds."}
]},
{d:16,events:[
{y:1996,t:"Wladimir Klitschko KO 1 Fabian Meza",p:"Hamburg, Germany",x:""},
{y:1996,t:"<a class='boxer-link' href='/en/boxers/vitali-klitschko'>Vitali Klitschko</a> KO 2 Tony Bradham",p:"Hamburg, Germany",x:"The professional debuts of the future Ukrainian champions."}
]},
{d:17,events:[
{y:1972,t:"Esteban De Jesus UD 10 Roberto Duran",p:"New York, USA",x:"The first defeat in Roberto Duran's career. He was knocked down in the opening round and lost on the scorecards 6-2, 6-3, 5-4."},
{y:2001,t:"Lennox Lewis KO 4 Hasim Rahman",p:"Las Vegas, USA",v:"OcIAq8lq36c",x:"Bout for the IBF, WBC and IBO heavyweight titles. Rematch: the first fight ended in a fifth-round knockout loss for Lewis."}
]},
{d:19,events:[
{y:2005,t:"Floyd Mayweather TKO 6 <a class='boxer-link' href='/en/boxers/sharmba-mitchell'>Sharmba Mitchell</a>",p:"Portland, USA",x:"Mitchell was knocked down twice, in the 3rd and 6th rounds, and lost by stoppage at 2 minutes 6 seconds of the sixth round."}
]},
{d:22,events:[
{y:1986,t:"Mike Tyson TKO 2 Trevor Berbick",p:"Las Vegas, USA",x:"Mike Tyson destroyed Berbick in the second round, winning his first WBC belt. That made Mike the youngest heavyweight champion in history."},
{y:1997,t:"Shannon Briggs MD 12 George Foreman",p:"Atlantic City, USA",x:"The last fight of Foreman's career."}
]},
{d:23,events:[
{y:1991,t:"Evander Holyfield TKO 7 Bert Cooper",p:"Atlanta, USA",x:"Bout for the WBA and IBF heavyweight titles."},
{y:2002,t:"Vitali Klitschko TKO 10 Larry Donald",p:"Dortmund, Germany",x:"WBA heavyweight title eliminator."}
]},
{d:25,events:[
{y:1977,t:"<a class='boxer-link' href='/en/boxers/thomas-hearns'>Thomas Hearns</a> KO 2 Jerome Hill",p:"Detroit, USA",x:"The professional debut of both Hearns and Hill."},
{y:1980,t:"Sugar Ray Leonard TKO 8 Roberto Duran",p:"New Orleans, USA",v:"6mZl4Q5xzn4",x:"Bout for the WBC welterweight title. Rematch: in the first fight Duran won on a decision, becoming the first man to beat Leonard."},
{y:2000,t:"Vitali Klitschko UD 12 Timo Hoffmann",p:"Hanover, Germany",x:"Bout for the vacant EBU heavyweight title. The Ukrainian's return after the first defeat of his career, against Chris Byrd."}
]},
{d:28,events:[
{y:2015,t:"<a class='boxer-link' href='/en/height-compare?a=fury'>Tyson Fury</a> UD 12 Wladimir Klitschko",p:"Dusseldorf, Germany",v:"t3mHmNO1rTs",x:"Bout for the world heavyweight titles (WBA Super, IBF, WBO, IBO and The Ring). Wladimir Klitschko was defending his belts after years of dominance in the division, but the unbeaten British challenger Tyson Fury managed to outbox the champion tactically. Fury's unanimous decision victory (twice 115-112 and 116-111) shocked the world and ended the era of the Klitschko brothers' dominance at heavyweight.",live:{intro:"Watch the video and score this legendary fight right now.",src:"/?widget=1&lang=en&fight=fury-klitschko"}}
]},
{d:30,events:[
{y:1979,t:"Sugar Ray Leonard TKO 15 <a class='boxer-link' href='/en/boxers/wilfred-benitez'>Wilfred Benitez</a>",p:"Las Vegas, USA",x:"Bout for the WBC welterweight title."},
{y:1996,t:"Vitali Klitschko TKO 1 Frantisek Sumina",p:"Vienna, Austria",x:""},
{y:1996,t:"Wladimir Klitschko TKO 2 Exum Speight",p:"Vienna, Austria",x:"The second professional fights of the Klitschko brothers."}
]}
];

      if(ev.v) html += '<div class="video-embed" data-vid="' + ev.v + '"><img src="https://img.youtube.com/vi/' + ev.v + '/hqdefault.jpg" alt="' + ev.t.replace(/<[^>]+>/g,'') + ' - video"><div class="video-play"></div></div>';
      if(ev.x) html += '<div class="event-body">' + ev.x + '</div>';
      if(ev.photo) html += '<div class="hist-photo"><img src="' + ev.photo.src + '" alt="' + ev.photo.alt + '" loading="lazy"><div class="hist-photo-cap">Photo: ' + ev.photo.srcEn + '</div></div>';
      if(ev.img) html += '<div class="hist-photo"><img src="' + ev.img.src + '" alt="' + ev.img.alt + '" loading="lazy"><div class="tool-cta"><div class="tool-cta-text">' + ev.img.cta + '</div><a class="tool-cta-btn" href="' + ev.img.href.replace(/^\/height-compare/, '/en/height-compare') + '">Compare heights →</a></div></div>';
      if(ev.live) html += '<div class="live-widget"><div class="live-widget-intro">' + ev.live.intro + '</div><iframe src="' + ev.live.src + '" loading="lazy" title="Scorecard"></iframe></div>';
      e.innerHTML = html;
      block.appendChild(e);
    });

    content.appendChild(block);
  });

  // Build the 30-cell calendar strip. Days with no content (e.g. Sep 6) are
  // permanently muted/non-clickable - never treated as "current" or "passed".
  var calCells = {};
  for(var n=1;n<=30;n++){
    var hasEvent = eventDayNums.indexOf(n) > -1;
    var c = document.createElement('div');
    c.className = 'cal-cell' + (hasEvent ? ' has-event' : ' no-event');
    c.textContent = n;
    if(hasEvent){
      c.addEventListener('click', function(day){
        return function(){ document.getElementById('d'+day).scrollIntoView({behavior:'smooth', block:'start'}); };
      }(n));
    }
    calRow.appendChild(c);
    calCells[n] = c;
  }

  var activeDay = -1;
  function renderCal(day){
    if(day === activeDay) return;
    activeDay = day;
    for(var n=1;n<=30;n++){
      var el = calCells[n];
      if(eventDayNums.indexOf(n) === -1) continue;
      el.classList.remove('passed','active');
      if(n < day) el.classList.add('passed');
      else if(n === day) el.classList.add('active');
    }
    progLabel.textContent = day + ' / 30';
    calCells[day].scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'});
  }

  function updateActive(){
    var ref = calBar.getBoundingClientRect().bottom + 8;
    var best = 0;
    for(var i=0;i<dayIds.length;i++){
      var rect = document.getElementById(dayIds[i]).getBoundingClientRect();
      if(rect.top <= ref){ best = i; } else { break; }
    }
    renderCal(DAYS[best].d);
  }
  window.addEventListener('scroll', updateActive, {passive:true});
  window.addEventListener('resize', updateActive);
  updateActive();

  content.addEventListener('click', function(e){
    var box = e.target.closest('.video-embed');
    if(!box) return;
    var vid = box.getAttribute('data-vid');
    box.innerHTML = '<iframe src="https://www.youtube.com/embed/' + vid + '?autoplay=1" title="YouTube video" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>';
  });
})();
</script>
</body>
</html>
