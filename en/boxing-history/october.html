var DAYS = [
{d:1,events:[
{y:1924,t:"Charles Smith died at the age of ~64",p:"",x:"An American boxer also known as Charles K. Smith, Charles A.C. Smith, and Charlie Smith, he was an African American boxer who claimed the status of World Colored Heavyweight Champion and was the first boxer recognized as such. Record: 40-14-5, 32 KOs."},
{y:1975,t:"<a class=\"boxer-link\" href=\"/height-compare?a=ali&lang=en\">Muhammad Ali</a> RTD 14 <a class=\"boxer-link\" href=\"/height-compare?a=frazier&lang=en\">Joe Frazier</a>",p:"Manila, USA",x:"The bout was named \"Thrilla in Manila.\" One of the greatest and most brutal fights in boxing history. The matchup took place in Quezon City (a suburb of Manila, Philippines). This was the third and final meeting in the ring between two legendary heavyweights. Muhammad Ali defended his WBC and WBA world heavyweight titles. Before the final round, Ali was ready to quit, but Frazier's corner pulled their fighter out first."}
]},
{d:2,events:[
{y:1980,t:"<a class=\"boxer-link\" href=\"/height-compare?a=holmes&lang=en\">Larry Holmes</a> TKO 11 Muhammad Ali",p:"Las Vegas, USA",v:"Kw1P8V1OMyY",x:"Bout for the WBC heavyweight title. Ali stepped into the ring at 38 years old with clear signs of physical fatigue (he would later be diagnosed with Parkinson's syndrome). The athletic commission secretly gave permission for the fight despite alarming medical tests. Holmes dominated the entire bout, but hit his former mentor (Larry was once Ali's sparring partner) with visible regret. After the 11th round, trainer Angelo Dundee stopped the beating, recording Muhammad's first and only stoppage defeat of his career."}
]},
{d:3,events:[
{y:1981,t:"<a class=\"boxer-link\" href=\"/height-compare?a=arguello&lang=en\">Alexis Arguello</a> TKO 14 Ray Mancini",p:"Atlantic City, USA",x:"28-year-old Arguello held the WBC lightweight title. For Mancini, this defeat was the first in his professional career."},
{y:1981,t:"<a class=\"boxer-link\" href=\"/height-compare?a=hagler&lang=en\">Marvin Hagler</a> TKO 11 Mustafa Hamsho",p:"Illinois, USA",x:"Bout for the WBC middleweight belt."},
{y:1998,t:"<a class=\"boxer-link\" href=\"/height-compare?a=mayweather&lang=en\">Floyd Mayweather</a> TKO 8 Genaro Hernandez",p:"Las Vegas, USA",x:"21-year-old Mayweather became the first 1996 Olympian to win a world title. Floyd captured the WBC super featherweight belt."}
]},
{d:4,events:[
{y:1890,t:"Frankie Conley was born",p:"",x:"The Italian boxer was a flyweight champion. Conley beat Monte Attell over 42 rounds on February 22, 1910. One of the rarest champions of that time."},
{y:2003,t:"<a class=\"boxer-link\" href=\"/height-compare?a=holyfield&lang=en\">Evander Holyfield</a> TKO 9 James Toney",p:"Nevada, USA",x:"For Holyfield, this defeat was his second in a row. In 2002 he lost to Chris Byrd, and in his very first fight in 2003 - to Toney, who was not a natural heavyweight."},
{y:2014,t:"<a class=\"boxer-link\" href=\"/height-compare?a=usyk&lang=en\">Oleksandr Usyk</a> TKO 7 Daniel Bruwer",p:"Lviv, Ukraine",x:""}
]},
{d:5,events:[
{y:1991,t:"<a class=\"boxer-link\" href=\"/height-compare?a=whitaker_p&lang=en\">Pernell Whitaker</a> UD 12 Jorge Paez",p:"Nevada, USA",x:"Whitaker defended the WBC and IBF lightweight titles."},
{y:2013,t:"<a class=\"boxer-link\" href=\"/height-compare?a=klitschko_w&lang=en\">Wladimir Klitschko</a> UD 12 Alexander Povetkin",p:"Moscow, RU",x:"Bout for the WBA, WBC, IBF, and IBO heavyweight belts, a meeting of two Olympic champions. Povetkin suffered a knockdown in the second and twice in the seventh rounds. Klitschko secured a dominant victory: 119-104 three times."},
{y:2019,t:"<a class=\"boxer-link\" href=\"/height-compare?a=golovkin&lang=en\">Gennadiy Golovkin</a> UD 12 <a class=\"boxer-link\" href=\"/height-compare?a=derevyanchenko&lang=en\">Sergiy Derevyanchenko</a>",p:"New York, USA",x:""}
]},
{d:6,events:[
{y:1978,t:"<a class=\"boxer-link\" href=\"/height-compare?a=hatton&lang=en\">Ricky Hatton</a> was born",p:"",x:"British professional boxer who competed in the super lightweight division. 2005 Fighter of the Year by The Ring magazine. Former world champion by the IBF (2005-2006, 2007), WBA (Super) (2005-2006), IBO (2007-2009), The Ring (2005-2009) in super lightweight, and by the WBA (2006) in welterweight.",photo:{src:"/images/history/ricky-hatton.jpg",alt:"Ricky Hatton wearing boxing gloves",srcUk:"Ethan Miller / Getty Images",srcEn:"Ethan Miller / Getty Images"}},
{y:2018,t:"<a class=\"boxer-link\" href=\"/height-compare?a=dubois&lang=en\">Daniel Dubois</a> PTS 10 Kevin Johnson",p:"Leicester, Great Britain",x:""}
]},
{d:7,events:[
{y:2000,t:"Paulie Ayala UD 12 Johnny Tapia",p:"Las Vegas, USA",x:"Rematch. The first bout took place in the summer of 1999 and became Fight of the Year. In both matchups, Ayala won by close judges' decisions."}
]},
{d:9,events:[
{y:2021,t:"<a class=\"boxer-link\" href=\"/height-compare?a=fury&lang=en\">Tyson Fury</a> KO 11 <a class=\"boxer-link\" href=\"/height-compare?a=wilder&lang=en\">Deontay Wilder</a>",p:"Las Vegas, USA",x:"Third fight of the trilogy. The first matchup ended in a draw. In the second, Fury knocked out the American in the 7th round. In the third matchup, everything ended in the 11th round with a victory for the Briton. Wilder suffered knockdowns in the 3rd, 10th, and 11th rounds. Fury - twice in the 4th."}
]},
{d:10,events:[
{y:1942,t:"Chartchai Chionoi was born",p:"",x:"Professional Thai boxer who competed in the flyweight division. WBA and WBC flyweight world champion. The third Thai world boxing champion. Finished his career with a record of 61-18-3, 36 KOs."},
{y:2001,t:"Eddie Futch died",p:"",x:"Boxing Hall of Famer who trained 22 world champions: Frazier, Holmes, Norton, Spinks, Arguello, Bowe, and others. He was 90 years old."}
]},
{d:11,events:[
{y:1938,t:"Luis Molina was born in Santa Barbara, USA",p:"",x:"American boxer, Olympian. Record - 32-10, 20 KOs."},
{y:1920,t:"Georges Carpentier KO 4 Battling Levinsky",p:"New Jersey, USA",x:"Bout for the light heavyweight title."},
{y:1996,t:"Floyd Mayweather TKO 2 Alberto Apodaca",p:"Las Vegas, USA",x:"Floyd Mayweather's professional boxing debut. For Apodaca, this bout was also his debut in the professional ring. Floyd finished his career with a 50-0 record."},
{y:1998,t:"Naseem Hamed TKO 7 Jose Badillo",p:"London, Great Britain",x:"WBO featherweight belt."},
{y:2008,t:"<a class=\"boxer-link\" href=\"/height-compare?a=klitschko_v&lang=en\">Vitali Klitschko</a> RTD 8 <a class=\"boxer-link\" href=\"/height-compare?a=peter&lang=en\">Samuel Peter</a>",p:"Berlin, Germany",v:"UHHWEzNOr5A",x:"Klitschko returned after a 4-year hiatus straight into a bout for the WBC heavyweight belt, utilizing his \"Eternal WBC Champion\" status. Prior to this bout, Peter had only lost to Wladimir Klitschko."}
]},
{d:12,events:[
{y:2013,t:"<a class=\"boxer-link\" href=\"/height-compare?a=lomachenko&lang=en\">Vasiliy Lomachenko</a> KO 4 Jose Luis Ramirez",p:"",x:"At stake was the WBO International featherweight title. Professional boxing debut of two-time Olympic champion Vasiliy Lomachenko."}
]},
{d:13,events:[
{y:1939,t:"<a class=\"boxer-link\" href=\"/height-compare?a=armstrong_h&lang=en\">Henry Armstrong</a> KO 2 Howard Scott",p:"Minneapolis, USA",x:"Armstrong defended his welterweight world title. This was his second defense in four days, and one of five title defenses he made in October of that same year."},
{y:1945,t:"Joe Cortez was born",p:"",x:"Puerto Rican referee, Boxing Hall of Famer."},
{y:2001,t:"<a class=\"boxer-link\" href=\"/height-compare?a=tyson&lang=en\">Mike Tyson</a> RTD 6 Brian Nielsen",p:"Copenhagen, Denmark",x:""},
{y:2001,t:"Ray Mercer KO 2 Brian Scott",p:"Copenhagen, Denmark",x:""}
]},
{d:14,events:[
{y:1949,t:"<a class=\"boxer-link\" href=\"/height-compare?a=charles&lang=en\">Ezzard Charles</a> KO 8 Pat Valentino",p:"San Francisco, USA",x:"Bout for the vacant NBA heavyweight title. The event gathered 19,950 spectators."},
{y:1997,t:"Floyd Mayweather KO 6 Felipe Garcia",p:"Idaho, USA",x:""}
]},
{d:15,events:[
{y:1858,t:"John Lawrence Sullivan was born",p:"",x:"American heavyweight boxer nicknamed \"The Boston Strongboy.\" Held the championship title from February 7, 1882, to September 7, 1892. The first American athlete to earn over $1 million. During his tours across the country, Sullivan knocked out, by various estimates, four to five hundred opponents in bouts, most of which were not sanctioned by any official bodies, and many of which were essentially barroom brawls."},
{y:1915,t:"Dado Marino was born",p:"",x:"Hawaiian boxer who competed in the flyweight division. Was a WBA world champion. Finished his career with a record of 57-14-3, 21 KOs."}
]},
{d:16,events:[
{y:1909,t:"Jack Johnson KO 12 Stanley Ketchel",p:"California, USA",x:"Johnson defended his heavyweight world title. Ketchel was shot almost a year later in Conway, Missouri - on October 15, 1910, by Walter Dipley, who was jealous of the attention his girlfriend showed toward the boxer."},
{y:1987,t:"Mike Tyson KO 7 Tyrell Biggs",p:"Atlantic City, USA",v:"2Q-5DCL99JY",x:"Tyson retained his status as heavyweight champion. For Biggs, this was his first career defeat."},
{y:2010,t:"Vitali Klitschko UD 12 Shannon Briggs",p:"Hamburg, Germany",x:"Klitschko defended his WBC heavyweight title. Briggs was perceived as a real threat - due to his punching power, experience, and constant provocations toward the brothers. However, he left the ring with broken orbital bones."},
{y:2022,t:"<a class=\"boxer-link\" href=\"/height-compare?a=haney&lang=en\">Devin Haney</a> UD 12 George Kambosos Jr.",p:"Melbourne, Australia",x:"Rematch. Haney defended his lightweight titles with another confident points victory."}
]},
{d:17,events:[
{y:2009,t:"<a class=\"boxer-link\" href=\"/height-compare?a=froch&lang=en\">Carl Froch</a> SD 12 Andre Dirrell",p:"Nottingham, Great Britain",x:"Froch defended his WBC super middleweight belt."},
{y:2015,t:"<a class=\"boxer-link\" href=\"/height-compare?a=gonzalez_r&lang=en\">Roman Gonzalez</a> TKO 9 Brian Viloria",p:"New York, USA",x:"Gonzalez defended his WBC flyweight title."},
{y:2015,t:"Gennadiy Golovkin KO 8 David Lemieux",p:"New York, USA",x:"Golovkin defended his WBC middleweight title."},
{y:2020,t:"<a class=\"boxer-link\" href=\"/height-compare?a=lopez_t&lang=en\">Teofimo Lopez</a> UD 12 Vasiliy Lomachenko",p:"Las Vegas, USA",v:"e--kj3Uh7xs",x:"Bout for the lightweight undisputed championship.",live:{intro:"Score this fight yourself, right now, while watching it with our tool:",src:"/?widget=1&lang=en&fight=lopez-lomachenko"}}
]},
{d:18,events:[
{y:1991,t:"Ray Mercer KO 5 Tommy Morrison",p:"Atlantic City, USA",x:"Mercer defended his WBO heavyweight title. Morrison was undefeated at the time of the meeting."},
{y:1994,t:"<a class=\"boxer-link\" href=\"/height-compare?a=duran_r&lang=en\">Roberto Duran</a> RTD 6 Heath Todd",p:"",x:""},
{y:1997,t:"Arturo Gatti TKO 6 Gabriel Ruelas",p:"Atlantic City, USA",x:"Defense of the IBF super featherweight world title. This matchup entered the hall of fame as one of the bloodiest and most brutal \"wars\" in boxing history. In the 5th round, Gatti suffered a heavy knockdown but got up. In the 6th round, the Canadian-Italian \"Thunder\" threw a powerful left hook that sent Ruelas into a flat-line knockout. The bout was named Fight of the Year by The Ring magazine."},
{y:2019,t:"Artur Beterbiev TKO 10 <a class=\"boxer-link\" href=\"/height-compare?a=gvozdyk&lang=en\">Oleksandr Gvozdyk</a>",p:"Pennsylvania, USA",x:"Bout for the IBF and WBC light heavyweight belts. At the time of the stoppage, Gvozdyk was winning on two judges' scorecards: 87-84 and 86-85. The third had Beterbiev winning 87-83."}
]},
{d:19,events:[
{y:1985,t:"Lee Roy Murphy KO 12 Chisanda Mutti",p:"Fontvieille, Monaco",x:"At stake was the IBF cruiserweight title. At the time of the stoppage, Mutti was leading on the judges' scorecards twice 106-102 and 105-101. However, in the final round, both boxers simultaneously knocked each other down. Murphy got up, but Mutti did not."},
{y:1987,t:"Marvin Hagler TKO 3 Mustafa Hamsho",p:"New York, USA",v:"dbx_lw4EHGU",x:"Bout for the IBF middleweight title. Rematch, the first fight ended in a stoppage victory for Hagler in the 11th round."}
]},
{d:20,events:[
{y:1979,t:"John Tate UD 15 Gerrie Coetzee",p:"Pretoria, South Africa",x:"Tate captured the vacant WBA heavyweight title by defeating the previously undefeated opponent. The event gathered 86,000 spectators."}
]},
{d:21,events:[
{y:2000,t:"Floyd Mayweather TKO 9 Emanuel Augustus",p:"Michigan, USA",x:"Mayweather faced the legendary \"Drunken Master.\" Floyd later called Augustus one of the most difficult opponents in his professional career."}
]},
{d:22,events:[
{y:1966,t:"<a class=\"boxer-link\" href=\"/height-compare?a=ortiz_c&lang=en\">Carlos Ortiz</a> TKO 5 Sugar Ramos",p:"Mexico City, Mexico",x:"Ortiz defended the WBA and WBC lightweight titles. Referee Billy Conn stopped the fight in the 5th round due to a cut above Ramos's eye. This round was named Round of the Year by The Ring magazine. The decision angered fans who threw objects into the ring, and WBC President Luis Spota declared the title vacant and ordered a rematch."}

(function(){
  var content = document.getElementById('content');
  var calRow = document.getElementById('calRow');
  var calBar = document.getElementById('calBar');
  var progLabel = document.getElementById('progLabel');
  var dayIds = [];
  var eventDayNums = [];

  DAYS.forEach(function(day){
    var id = 'd' + day.d;
    dayIds.push(id);
    eventDayNums.push(day.d);

    var block = document.createElement('div');
    block.className = 'day-block';
    block.id = id;
    var h2 = document.createElement('div');
    h2.className = 'day-h2';
    var monthNames = ["","January","February","March","April","May","June","July","August","September","October","November","December"];
    h2.innerHTML = '<time datetime="2026-10-' + String(day.d).padStart(2,'0') + '">October ' + day.d + '</time>';
    block.appendChild(h2);

    day.events.forEach(function(ev){
      var e = document.createElement('div');
      e.className = 'event';
      var html = '<div class="event-year">' + ev.y + '</div>';
      html += '<h3 class="event-title">' + ev.t + '</h3>';
      if(ev.p) html += '<div class="event-place">' + ev.p + '</div>';
      if(ev.v) html += '<div class="video-embed" data-vid="' + ev.v + '"><img src="https://img.youtube.com/vi/' + ev.v + '/hqdefault.jpg" alt="' + ev.t.replace(/<[^>]+>/g,'') + ' - video"><div class="video-play"></div></div>';
      if(ev.x) html += '<div class="event-body">' + ev.x + '</div>';
      if(ev.photo) html += '<div class="hist-photo"><img src="' + ev.photo.src + '" alt="' + ev.photo.alt + '" loading="lazy"><div class="hist-photo-cap">Photo: ' + ev.photo.srcEn + '</div></div>';
      if(ev.img) html += '<div class="hist-photo"><img src="' + ev.img.src + '" alt="' + ev.img.alt + '" loading="lazy"><div class="tool-cta"><div class="tool-cta-text">' + ev.img.cta + '</div><a class="tool-cta-btn" href="' + ev.img.href + (ev.img.href.indexOf('?')>-1?'&lang=en':'?lang=en') + '">Compare heights →</a></div></div>';
      if(ev.live) html += '<div class="live-widget"><div class="live-widget-intro">' + ev.live.intro + '</div><iframe src="' + ev.live.src + '" loading="lazy" title="Scorecard"></iframe></div>';
      e.innerHTML = html;
      block.appendChild(e);
    });

    content.appendChild(block);
  });

  // Build the 30-cell calendar strip. Days with no content (e.g. Sep 6) are
  // permanently muted/non-clickable - never treated as "current" or "passed".
  var calCells = {};
  for(var n=1;n<=31;n++){
    var hasEvent = eventDayNums.indexOf(n) > -1;
    var c = document.createElement('div');
    c.className = 'cal-cell' + (hasEvent ? ' has-event' : ' no-event');
    c.textContent = n;
    if(hasEvent){
      c.addEventListener('click', function(day){
        return function(){ document.getElementById('d'+day).scrollIntoView({behavior:'smooth', block:'start'}); };
      }(n));
    }
    calRow.appendChild(c);
    calCells[n] = c;
  }

  var activeDay = -1;
  function renderCal(day){
    if(day === activeDay) return;
    activeDay = day;
    for(var n=1;n<=31;n++){
      var el = calCells[n];
      if(eventDayNums.indexOf(n) === -1) continue;
      el.classList.remove('passed','active');
      if(n < day) el.classList.add('passed');
      else if(n === day) el.classList.add('active');
    }
    progLabel.textContent = day + ' / 31';
    calCells[day].scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'});
  }

  function updateActive(){
    var ref = calBar.getBoundingClientRect().bottom + 8;
    var best = 0;
    for(var i=0;i<dayIds.length;i++){
      var rect = document.getElementById(dayIds[i]).getBoundingClientRect();
      if(rect.top <= ref){ best = i; } else { break; }
    }
    renderCal(DAYS[best].d);
  }
  window.addEventListener('scroll', updateActive, {passive:true});
  window.addEventListener('resize', updateActive);
  updateActive();

  content.addEventListener('click', function(e){
    var box = e.target.closest('.video-embed');
    if(!box) return;
    var vid = box.getAttribute('data-vid');
    box.innerHTML = '<iframe src="https://www.youtube.com/embed/' + vid + '?autoplay=1" title="YouTube video" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>';
  });
})();
</script>
</body>
</html>
