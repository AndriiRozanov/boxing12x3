<script>
var DAYS = [
{d:1,events:[
{y:1866,t:"James J. Corbett was born",p:"",x:"James J. Corbett was an American professional boxer and heavyweight world champion, best known as the only man who ever defeated John L. Sullivan."},
{y:1923,t:"<a class='boxer-link' href='/height-compare?a=marciano&lang=en'>Rocky Marciano</a> was born",p:"",x:"Rocky Marciano was an American heavyweight boxer who became world champion five years in a row (1952, 1953, 1954, 1955, and 1956). He is currently the only heavyweight world champion who went undefeated throughout his entire sports career. Marciano retired with a record of 49-0, 43 KOs."},
{y:1960,t:"Duilio Loi MD 15 Carlos Ortiz",p:"",x:""},
{y:1966,t:"Hector Lizarraga was born",p:"",x:"Hector Lizarraga is a well-known Mexican professional boxer who fought from 1985 to 2003. The major achievement of his career was winning the IBF featherweight world title, which he held from December 13, 1997, to April 24, 1998."},
{y:1973,t:"<a class='boxer-link' href='/height-compare?a=foreman&lang=en'>George Foreman</a> KO 1 Jose Roman",p:"Tokyo, Japan",x:"Foreman defended his WBC heavyweight title. Earlier that same year, Foreman knocked out Joe Frazier in two rounds. The 1st-round knockout victory snapped Jose Roman's 6-fight winning streak. Foreman left the ring with a 39-0 record, and in his next bout brought it to 40-0 by knocking out Ken Norton. The only one who could stop George back then was Muhammad Ali, a year after the win over Roman."},
{y:1973,t:"Ricardo Arredondo KO 6 Morito Kashiwaba",p:"",x:"Bout on the undercard of Foreman vs. Roman."},
{y:1976,t:"<a class='boxer-link' href='/height-compare?a=morales&lang=en'>Erik Morales</a> was born",p:"",x:"Erik Morales is a Mexican professional boxer, world champion in super bantamweight (WBC and WBO), featherweight (WBC), super featherweight (WBC and IBF), and super lightweight (WBC). In total, he defeated 18 fighters in world title bouts across four weight classes."},
{y:2013,t:"Tommy Morrison died at the age of 44",p:"",x:"Tommy Morrison died on September 1, 2013, at an Omaha (Nebraska) medical center. The cause of death was cardiac arrest caused by multiorgan failure, which in turn was triggered by septic shock caused by Pseudomonas aeruginosa."}
]},
{d:2,events:[
{y:1906,t:"Emile Pladner was born",p:"",x:"Emile Pladner was a French boxer, flyweight champion of France, Europe, and the world, as well as a flyweight champion of France and Europe."},
{y:1939,t:"Nicolino Locche was born",p:"",x:"Nicolino Locche was an Argentine professional boxer who held the WBA super lightweight world title from 1968 to 1972. Locche is often called one of the greatest defensive master boxers of all time. In 2003, he was inducted into the International Boxing Hall of Fame."},
{y:1953,t:"Sonny Liston KO 1 Don Smith",p:"St. Louis",x:"Liston's professional debut. Throughout his career, Sonny would become heavyweight world champion and also be named one of the scariest boxers in sports history. Liston finished his career with a record of 50-4, 39 KOs."},
{y:1959,t:"Antonio Esparragoza was born",p:"",x:"Antonio Esparragoza is a Venezuelan boxer, competitor in the featherweight division. He competed for the Venezuelan national boxing team in the second half of the 1970s, bronze medalist of the World Championships, winner and medalist of many international tournaments, and participant in the Summer Olympic Games in Moscow. From 1981 to 1991, he successfully boxed at the professional level, holding the WBA world title."},
{y:1965,t:"<a class='boxer-link' href='/height-compare?a=lewis&lang=en'>Lennox Lewis</a> was born",p:"",x:"Lennox Lewis is a Canadian and British professional boxer. 1988 Olympic heavyweight champion. Former undisputed heavyweight world champion and the last undisputed heavyweight champion in history during the era when holding three belts (WBC, IBF, and WBA) was required for this title. He defeated 15 fighters in heavyweight world title bouts.",photo:{src:"/images/history/lennox-lewis-belts.jpg",alt:"Lennox Lewis with his championship belts",srcUk:"John Gichigi /Allsport",srcEn:"John Gichigi /Allsport"}},
{y:1971,t:"Antonio Gomez KO 5 Shozo Saijo",p:"",x:""},
{y:1978,t:"Ricardo Cardona UD 15 Ruben Valdez",p:"",x:""},
{y:1995,t:"Frank Bruno UD 12 <a class='boxer-link' href='/height-compare?a=mccall&lang=en'>Oliver McCall</a>",p:"London, Great Britain",x:"Bruno became the WBC heavyweight champion."},
{y:1995,t:"Virgil Hill UD 12 Drake Thadzi",p:"London, Great Britain",x:"Hill defended his WBA super lightweight title on the undercard of the Bruno vs. McCall bout."},
{y:1995,t:"<a class='boxer-link' href='/height-compare?a=benn_n&lang=en'>Nigel Benn</a> KO 7 Daniel Perez",p:"London, Great Britain",x:"Matchup on the undercard of the Bruno vs. McCall bout."}
]},
{d:3,events:[
{y:1908,t:"Tommy Burns KO 6 Bill Lang",p:"Melbourne, Australia",x:""}
]},
{d:4,events:[
{y:1928,t:"Fred Bretonnel died",p:"",x:"Fred Bretonnel was a French featherweight boxer and holder of the French featherweight title from June 24 to October 7, 1924. On May 10, 1922, he participated in the first French-German match in France after World War I, defeating Paul Chirson. Bretonnel died by committing suicide by hanging. \u201cFamily troubles\u201d were cited as the reason."},
{y:1983,t:"Francisco \u201cKiko\u201d Bejines died days after a title bout",p:"",x:"On September 1, 1983, at the Olympic Auditorium in Los Angeles, Bejines faced Alberto Davila for the vacant WBC world title. At the start of the 12th round, Davila sent Kiko Bejines into a deep knockout. The boxer lost consciousness right in the ring, was urgently hospitalized, and operated on for a severe brain injury - edema and hemorrhage. Despite the efforts of doctors, on September 4, 1983, 21-year-old Kiko died without regaining consciousness. This tragedy became another strong impetus for world boxing organizations to reduce championship fights from 15 to 12 rounds and strengthen medical control."}
]},
{d:5,events:[
{y:1960,t:"Cassius Clay wins Olympic gold",p:"Rome",x:"At the Rome Olympics, 18-year-old Cassius Clay (later Muhammad Ali) defeated Zbigniew Pietrzykowski and won Olympic gold.",photo:{src:"/images/history/clay-olympics-1960.jpg",alt:"Cassius Clay on the 1960 Olympic podium",srcUk:"Olympics",srcEn:"Olympics"}},
{y:1998,t:"Billy Soose died at the age of 83",p:"",x:"Billy Soose was an American boxer, 1941 middleweight world champion. Soose was featured on the cover of The Ring magazine for June 1941. He has been a member of the International Boxing Hall of Fame since 2009. He is also the subject of the book \u201cBilly Soose - The Champion Time Forgot.\u201d Soose was found dead at his home in Tafton, Pennsylvania, in 1998."},
{y:2026,t:"<a class='boxer-link' href='/height-compare?a=ruiz&lang=en'>Andy Ruiz Jr.</a> lost UD 12 to Damian Knyba",p:"Newark, USA",x:"Ahead of the bout, Ruiz weighed in at 115.3 kg. Knyba scaled 115.8 kg. For Andy Ruiz, this was a return to the ring after a two-year hiatus. It arose due to an injury the Mexican sustained in his matchup against Jarrell Miller. Knyba was returning after a stoppage loss to Agit Kabayel. The Pole lost to the German in three rounds, and in his comeback fight outboxed the ex-champion by judges' decision, twice 114-113 and 117-110. In the 7th round, Ruiz suffered a knockdown."}
]},
{d:7,events:[
{y:1894,t:"Edison films demonstration bout between Corbett and Courtney",p:"",x:"Thomas Edison filmed a demonstration bout between heavyweight world champion James J. Corbett and Peter Courtney. By agreement, Corbett knocks out his opponent in the 6th round. The film was shot exclusively in New Jersey, in the city of West Orange, on the grounds of the world's first movie studio, the Black Maria. Cameras at the time held film reels only 150 feet (about 45 meters) long. Because of this, each round lasted exactly one minute, after which filming was stopped to reload the camera. The fight was not an official title defense - it was a specially arranged exhibition bout for a financial reward. Each round was sold to clients as a separate mini-film (the price of one round in catalogs was $45). A viewer had to drop a coin into a machine - a kinetoscope - to watch one round. In the boxers' corners as seconds were prominent figures of the time, including legendary boxer and trainer William Muldoon, as well as popular theater actor Maurice Barrymore."},
{y:1908,t:"Billy Papke TKO 12/25 Stanley Ketchel",p:"Vernon, California, USA",x:"Middleweight world title. The Atlanta Constitution mentioned the following about the bout: \u201cWhen referee Jeffries announced the end of the round, and Ketchel walked to the center of the ring, extending his hand for a handshake, Papke ignored this gesture and rushed at the Michigan boxer.\u201d However, no Los Angeles newspaper reported that Papke delivered a punch at the moment Ketchel extended his hand. Most sources report that it was actually Ketchel who threw the first punch."},
{y:1990,t:"<a class='boxer-link' href='/height-compare?a=bowe&lang=en'>Riddick Bowe</a> RTD 8 Picklon Thomas",p:"",x:"Thomas's corner retired from the contest after the 8th round of the bout."},
{y:1996,t:"<a class='boxer-link' href='/height-compare?a=tyson&lang=en'>Mike Tyson</a> TKO 1 Bruce Seldon",p:"",x:"This bout was Mike's last before the duology against Holyfield. Just two months later, Tyson met Evander for the first time and was knocked out in the 11th round. In 1997, Tyson lost to Holyfield by stoppage for the second time."},
{y:1999,t:"Thomas Americo died in Dili",p:"",x:"Thomas Americo was a professional boxer from East Timor. He won the OPBF super lightweight world title in only his second registered professional fight. In his third bout, he became the first East Timorean fighter to challenge for a world title when he fought WBC super lightweight champion Saoul Mamby. Americo was the first Indonesian to fight for a world title, as well as the first boxer from East Timor to fight for a world title belt. During the final days of the Indonesian occupation of East Timor, acts of violence occurred on the streets of Dili, Americo's hometown. Americo became a victim of one of them; he was dragged from a car and shot by militia members on September 7, 1999, shortly before East Timor gained independence."},
{y:2005,t:"Nicolino Locche died",p:"",x:"The former world champion and one of the greatest defensive masters of all time died in Las Heras from a myocardial infarction."}
]},
{d:8,events:[
{y:1978,t:"Francisco \u201cKiko\u201d Bejines PTS 10 Agustin Macias",p:"Guadalajara, Mexico",x:""},
{y:2012,t:"Antonio DeMarco TKO 1 John Molina Jr.",p:"Oakland, USA",x:"DeMarco defended his WBC lightweight title. For Antonio, this was his second fight of the year. Prior to this, he defeated Miguel Roman, and previously in 2011, he knocked out Jorge Linares. At the end of 2012, DeMarco lost the title to Adrien Broner by technical knockout in the 8th round."},
{y:2012,t:"<a class='boxer-link' href='/height-compare?a=klitschko_v&lang=en'>Vitali Klitschko</a> TKO 4 Mahmoud Charr",p:"Moscow, RU",x:"The final fight of Vitali Klitschko's career. Mahmoud Charr suffered a knockdown in the 2nd round. The contest was stopped due to a cut on Charr. For Vitali, this was his second retirement. He first left boxing in 2004 and returned in 2008, utilizing the WBC's unprecedented \u201cEternal Champion\u201d status. The 2012 retirement became final for the older Klitschko brother.",v:"ee51q8BNnTQ"},
{y:2017,t:"<a class='boxer-link' href='/height-compare?a=benavidez&lang=en'>David Benavidez</a> SD 12 Ronald Gavril",p:"",x:"David Benavidez became the youngest super middleweight champion in boxing history. In the final three-minute round, Benavidez suffered a knockdown."}
]},
{d:9,events:[
{y:1969,t:"Fred Little KO 2 Hisao Minami",p:"Osaka, Japan",x:"Little defended his WBC super lightweight title."},
{y:1978,t:"<a class='boxer-link' href='/height-compare?a=gomez_w&lang=en'>Wilfredo Gomez</a> TKO 13 Leonardo Cruz",p:"San Juan, Puerto Rico",x:"Gomez defended his WBC super bantamweight title."},
{y:1978,t:"Sugar Ray Leonard TKO 10 Floyd Mayweather Sr.",p:"",x:"Floyd Mayweather Sr. suffered two knockdowns in the 8th round. In the final round, Sugar brought the contest to a stoppage victory."},
{y:1979,t:"Chan-Hee Park D-SD 15 Miguel Canto",p:"Seoul, Korea",x:"Park defended his WBC flyweight title."},
{y:1983,t:"<a class='boxer-link' href='/height-compare?a=pryor&lang=en'>Aaron Pryor</a> KO 10 <a class='boxer-link' href='/height-compare?a=arguello&lang=en'>Alexis Arguello</a>",p:"Las Vegas, USA",x:"Rematch between the then-undefeated Pryor and the Nicaraguan boxing legend. In the first matchup, Arguello lost by TKO 14 - at the time of the stoppage, Aaron was leading 127-124, 125-127, and 127-124. The second matchup ended quicker. At the time of the knockout, Pryor was winning 86-83, 85-83, and 87-82.",v:"3xxB3p8Qwwo"},
{y:1995,t:"<a class='boxer-link' href='/height-compare?a=delahoye&lang=en'>Oscar De La Hoya</a> RTD 6 Genaro Hernandez",p:"Las Vegas, USA",x:"At stake was the WBO lightweight belt. De La Hoya was leading on the judges' scorecards 58-56 and twice 59-55."},
{y:2000,t:"<a class='boxer-link' href='/height-compare?a=rjones&lang=en'>Roy Jones Jr.</a> RTD 10 Eric Harding",p:"New Orleans, USA",x:"Roy Jones unified the titles in the light heavyweight division, adding the IBO belt to the IBF and WBC titles. At the time of the stoppage, Jones was ahead on the judges' scorecards: 96-94, 97-93, and 98-92."},
{y:2000,t:"Willie Jorrin UD 12 Michael Brodie",p:"Manchester, Great Britain",x:""},
{y:2017,t:"<a class='boxer-link' href='/height-compare?a=usyk&lang=en'>Oleksandr Usyk</a> TKO 10 Marco Huck",p:"Berlin, Germany",x:"The first bout of the World Boxing Super Series, with the cruiserweight undisputed championship and the Muhammad Ali Trophy at stake. Usyk chose Huck as his opponent himself - the Ukrainian won the draw and chose his opponent first. Ahead of the event, Huck pushed Usyk during an official event and spoke negatively about Oleksandr's mother. Later, the winner noted that he wanted not just to win, but to thoroughly beat his opponent for that. In this matchup, Usyk was the champion - holding the WBO title. Oleksandr won it in a matchup against Krzysztof Glowacki in 2016, becoming the first to beat the Pole. After that, the Ukrainian defended the title twice - defeating Thabiso Mchunu and Michael Hunter."}
]},

{y:1966,t:"<a class='boxer-link' href='/height-compare?a=ali&lang=en'>Muhammad Ali</a> TKO 12 Karl Mildenberger",p:"Frankfurt, Germany",x:"Ali defended his WBC heavyweight title. The bout took place as part of Muhammad's European tour. During it, the American boxed twice in Great Britain - defeating Henry Cooper and Brian London. And then he beat Karl Mildenberger. During the European tour, Mildenberger lasted the longest against Ali. Cooper was knocked out in the 6th round, and London - in the third."},

(function(){
  var content = document.getElementById('content');
  var calRow = document.getElementById('calRow');
  var calBar = document.getElementById('calBar');
  var progLabel = document.getElementById('progLabel');
  var dayIds = [];
  var eventDayNums = [];

  DAYS.forEach(function(day){
    var id = 'd' + day.d;
    dayIds.push(id);
    eventDayNums.push(day.d);

    var block = document.createElement('div');
    block.className = 'day-block';
    block.id = id;
    var h2 = document.createElement('div');
    h2.className = 'day-h2';
    var monthNames = ["","January","February","March","April","May","June","July","August","September","October","November","December"];
    h2.innerHTML = '<time datetime="2026-09-' + String(day.d).padStart(2,'0') + '">September ' + day.d + '</time>';
    block.appendChild(h2);

    day.events.forEach(function(ev){
      var e = document.createElement('div');
      e.className = 'event';
      var html = '<div class="event-year">' + ev.y + '</div>';
      html += '<h3 class="event-title">' + ev.t + '</h3>';
      if(ev.p) html += '<div class="event-place">' + ev.p + '</div>';
      if(ev.v) html += '<div class="video-embed" data-vid="' + ev.v + '"><img src="https://img.youtube.com/vi/' + ev.v + '/hqdefault.jpg" alt="' + ev.t + ' - video"><div class="video-play"></div></div>';
      if(ev.x) html += '<div class="event-body">' + ev.x + '</div>';
      if(ev.photo) html += '<div class="hist-photo"><img src="' + ev.photo.src + '" alt="' + ev.photo.alt + '" loading="lazy"><div class="hist-photo-cap">Photo: ' + ev.photo.srcEn + '</div></div>';
      if(ev.img) html += '<div class="hist-photo"><img src="' + ev.img.src + '" alt="' + ev.img.alt + '" loading="lazy"><div class="tool-cta"><div class="tool-cta-text">' + ev.img.cta + '</div><a class="tool-cta-btn" href="' + ev.img.href + '?lang=en">Compare heights →</a></div></div>';
      if(ev.live) html += '<div class="live-widget"><div class="live-widget-intro">' + ev.live.intro + '</div><iframe src="' + ev.live.src + '" loading="lazy" title="Scorecard"></iframe></div>';
      e.innerHTML = html;
      block.appendChild(e);
    });

    content.appendChild(block);
  });

  // Build the 30-cell calendar strip. Days with no content (e.g. Sep 6) are
  // permanently muted/non-clickable - never treated as "current" or "passed".
  var calCells = {};
  for(var n=1;n<=30;n++){
    var hasEvent = eventDayNums.indexOf(n) > -1;
    var c = document.createElement('div');
    c.className = 'cal-cell' + (hasEvent ? ' has-event' : ' no-event');
    c.textContent = n;
    if(hasEvent){
      c.addEventListener('click', function(day){
        return function(){ document.getElementById('d'+day).scrollIntoView({behavior:'smooth', block:'start'}); };
      }(n));
    }
    calRow.appendChild(c);
    calCells[n] = c;
  }

  var activeDay = -1;
  function renderCal(day){
    if(day === activeDay) return;
    activeDay = day;
    for(var n=1;n<=30;n++){
      var el = calCells[n];
      if(eventDayNums.indexOf(n) === -1) continue;
      el.classList.remove('passed','active');
      if(n < day) el.classList.add('passed');
      else if(n === day) el.classList.add('active');
    }
    progLabel.textContent = day + ' / 30';
    calCells[day].scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'});
  }

  function updateActive(){
    var ref = calBar.getBoundingClientRect().bottom + 8;
    var best = 0;
    for(var i=0;i<dayIds.length;i++){
      var rect = document.getElementById(dayIds[i]).getBoundingClientRect();
      if(rect.top <= ref){ best = i; } else { break; }
    }
    renderCal(DAYS[best].d);
  }
  window.addEventListener('scroll', updateActive, {passive:true});
  window.addEventListener('resize', updateActive);
  updateActive();

  content.addEventListener('click', function(e){
    var box = e.target.closest('.video-embed');
    if(!box) return;
    var vid = box.getAttribute('data-vid');
    box.innerHTML = '<iframe src="https://www.youtube.com/embed/' + vid + '?autoplay=1" title="YouTube video" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>';
  });
})();
</script>
