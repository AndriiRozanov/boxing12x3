*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--red:#c0392b;--bg:#f7f6f3;--card:#fff;--text:#1a1a1a;--muted:#888;--border:#e5e3de;--r:10px;

body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);padding:1.5rem 1rem 4rem;line-height:1.7;}
.wrap{max-width:640px;margin:0 auto;}

/* Brand */
.lang-row{display:flex;justify-content:flex-end;gap:4px;margin-bottom:1rem;}
.lang-btn{font-size:11px;font-weight:500;padding:4px 10px;border-radius:20px;border:0.5px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;font-family:'DM Sans',sans-serif;}
.lang-btn.on{background:var(--text);color:#fff;border-color:var(--text);}
.brand{text-align:center;margin-bottom:1.5rem;}
.brand a{text-decoration:none;}
.brand-name{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:.12em;color:var(--text);margin:0;}
.brand-sub{font-size:10px;color:var(--muted);letter-spacing:.18em;text-transform:uppercase;margin-top:1px;}
.page-head{margin-bottom:24px;padding-bottom:18px;border-bottom:0.5px solid var(--border);}
.page-head h1{font-size:20px;font-weight:700;margin-bottom:4px;letter-spacing:-.01em;}
.page-head p{font-size:13px;color:#555;}

/* Controls */
.controls{background:var(--card);border:0.5px solid var(--border);border-radius:var(--r);padding:18px;margin-bottom:10px;}
.slots-grid{display:flex;flex-direction:column;gap:8px;}
.slot-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:start;}
.slot-inner{position:relative;}
.slot-label{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;margin-bottom:5px;display:block;}
.slot-input{width:100%;padding:9px 32px 9px 10px;border:0.5px solid var(--border);border-radius:6px;font-family:'DM Sans',sans-serif;font-size:13px;background:var(--bg);color:var(--text);outline:none;}
.slot-input:focus{border-color:#aaa;}
.slot-clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--muted);font-size:16px;line-height:1;display:none;padding:2px;}
.slot-input:not(:placeholder-shown) + .slot-clear{display:block;}
.dd{position:absolute;top:calc(100% + 3px);left:0;right:0;background:var(--card);border:0.5px solid var(--border);border-radius:8px;box-shadow:0 4px 20px rgba(0,0,0,.1);z-index:100;max-height:220px;overflow-y:auto;display:none;}
.dd.open{display:block;}
.dd-item{padding:8px 12px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;border-bottom:0.5px solid #f5f3ef;}
.dd-item:last-child{border-bottom:none;}
.dd-item:hover,.dd-item.hi{background:#faf9f7;}
.dd-name{font-size:13px;font-weight:500;}
.dd-meta{display:flex;align-items:center;gap:5px;}
.dd-ret{font-size:12px;}
.dd-div{font-size:10px;color:var(--muted);}
.rm-btn{background:none;border:0.5px solid var(--border);border-radius:5px;color:var(--muted);font-size:12px;cursor:pointer;padding:4px 8px;white-space:nowrap;font-family:'DM Sans',sans-serif;margin-top:22px;transition:all .1s;}
.rm-btn:hover{border-color:var(--red);color:var(--red);}
.add-btn{width:100%;margin-top:8px;padding:9px;border:0.5px dashed var(--border);border-radius:6px;background:transparent;color:var(--muted);font-size:13px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s;}
.add-btn:hover:not(:disabled){border-color:#888;color:var(--text);}
.add-btn:disabled{opacity:.35;cursor:not-allowed;}

/* CARD */
.card-wrap{margin-bottom:10px;}
.sharecard{background:#111;border-radius:var(--r);overflow:hidden;position:relative;box-shadow:0 4px 28px rgba(0,0,0,.18);}
.wm{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:'Bebas Neue',sans-serif;font-size:60px;letter-spacing:.2em;color:rgba(255,255,255,.04);white-space:nowrap;pointer-events:none;user-select:none;z-index:0;}
.card-body{position:relative;z-index:1;padding:20px 20px 16px;}
.card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
.ct-brand{font-family:'Bebas Neue',sans-serif;font-size:12px;letter-spacing:.16em;color:#333;}
.ct-badge{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;background:#1a1a1a;border:0.5px solid #2a2a2a;color:#555;padding:3px 8px;border-radius:3px;}

/* Columns */
.cols{display:flex;align-items:flex-end;height:240px;position:relative;margin-bottom:2px;}
.ruler{position:absolute;inset:0;pointer-events:none;z-index:0;}
.r-line{position:absolute;left:0;right:0;border-top:0.5px dashed rgba(255,255,255,.06);}
.r-lbl{position:absolute;right:0;font-size:9px;color:rgba(255,255,255,.18);font-family:'Bebas Neue',sans-serif;transform:translateY(-50%);letter-spacing:.04em;padding-right:3px;}
.col-wrap{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end;position:relative;z-index:1;}
.col-h{font-family:'Bebas Neue',sans-serif;letter-spacing:.06em;line-height:1;margin-bottom:4px;}
.col-bar{border-radius:5px 5px 0 0;overflow:hidden;transition:height 1s cubic-bezier(.22,.61,.36,1);position:relative;}
.col-bar::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(180deg,transparent,transparent 9px,rgba(0,0,0,.07) 9px,rgba(0,0,0,.07) 10px);}
.vs-gap{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 5px;padding-bottom:2px;gap:3px;flex-shrink:0;z-index:1;}
.vs-lbl{font-family:'Bebas Neue',sans-serif;font-size:10px;letter-spacing:.06em;color:#252525;background:#1a1a1a;border:0.5px solid #252525;padding:2px 5px;border-radius:2px;}
.vs-diff{font-size:8px;color:#3a3a3a;letter-spacing:.02em;white-space:nowrap;}
.floor{height:1px;background:#1e1e1e;margin:0 -20px;}

/* Fighter names */
.f-names{display:flex;padding:11px 0 9px;overflow:hidden;}
.f-block{flex:1;min-width:0;}
.f-block+.f-block{padding-left:8px;border-left:0.5px solid #1e1e1e;margin-left:8px;}
.f-n{font-family:'Bebas Neue',sans-serif;letter-spacing:.05em;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.f-sub{font-size:10px;color:#444;margin-top:2px;line-height:1.4;}

/* Card footer */
.card-footer{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:9px;border-top:0.5px solid #1a1a1a;}
.cf-l{font-family:'Bebas Neue',sans-serif;font-size:11px;letter-spacing:.14em;color:#2d2d2d;}
.cf-r{font-size:9px;color:#2d2d2d;}

/* Empty state */
.empty{height:240px;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:.1em;color:#2a2a2a;}

/* Share btn */
.share-btn{width:100%;padding:13px;background:var(--red);color:#fff;border:none;border-radius:6px;font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:.1em;cursor:pointer;margin-bottom:10px;transition:opacity .15s;}
.share-btn:hover{opacity:.9;}
.share-btn:disabled{opacity:.5;cursor:not-allowed;}

/* Note */
.note{font-size:12px;color:var(--muted);text-align:center;margin-bottom:24px;}

/* Footer */
.site-footer{text-align:center;padding:20px 0 8px;font-size:12px;color:var(--muted);}
.site-footer a{color:var(--muted);text-decoration:none;margin:0 6px;}
</style>

// ── LANGUAGE ──────────────────────────────────────────────────────────
function setLang(l) {
  lang = l;
  document.getElementById('btnUk').className = 'lang-btn' + (l==='uk'?' on':'');
  document.getElementById('btnEn').className = 'lang-btn' + (l==='en'?' on':'');
  document.documentElement.lang = l==='uk'?'uk':'en';
  var t = T[l];
  document.getElementById('brandSub').textContent = t.brandSub;
  document.getElementById('pageTitle').textContent = t.pageTitle;
  document.getElementById('pageDesc').textContent = t.pageDesc;
  document.getElementById('cardBadge').textContent = t.cardBadge;
  document.getElementById('emptyMsg') && (document.getElementById('emptyMsg').textContent = t.emptyMsg);
  document.getElementById('addBtn').textContent = slots.length>=4 ? t.addBtnMax : t.addBtn;
  document.getElementById('shareBtn').textContent = t.shareBtn;
  document.getElementById('shareNote').textContent = t.shareNote;
  document.getElementById('footerHome').textContent = t.footerHome;
  document.getElementById('footerGuide').textContent = t.footerGuide;
  buildControls();
  renderCard();
}

// ── CONTROLS ──────────────────────────────────────────────────────────
function buildControls() {
  var t = T[lang];
  var grid = document.getElementById('slotsGrid');
  grid.innerHTML = '';

  slots.forEach(function(boxer, idx) {
    var row = document.createElement('div');
    row.className = 'slot-row';

    var inner = document.createElement('div');
    inner.className = 'slot-inner';

    var lbl = document.createElement('label');
    lbl.className = 'slot-label';
    lbl.style.color = 'var('+COLORS[idx]+')';
    lbl.textContent = t.slotLabel[idx];

    var inp = document.createElement('input');
    inp.type = 'text';
    inp.className = 'slot-input';
    inp.placeholder = t.placeholder;
    inp.value = boxer ? boxer.name : '';
    inp.dataset.idx = idx;

    var clr = document.createElement('button');
    clr.className = 'slot-clear';
    clr.textContent = '×';
    (function(i){ clr.onclick = function(){ clearSlot(i); }; })(idx);

    var dd = document.createElement('div');
    dd.className = 'dd';
    dd.id = 'dd'+idx;

    inp.addEventListener('input',  function(){ onSearch(this, idx); });
    inp.addEventListener('focus',  function(){ onSearch(this, idx); });
    inp.addEventListener('blur',   function(){ setTimeout(function(){ var d=document.getElementById('dd'+idx);if(d)d.classList.remove('open'); }, 200); });
    inp.addEventListener('keydown', function(e){ onKey(e, idx); });

    inner.appendChild(lbl);
    inner.appendChild(inp);
    inner.appendChild(clr);
    inner.appendChild(dd);
    row.appendChild(inner);

    if (idx >= 2) {
      var rm = document.createElement('button');
      rm.className = 'rm-btn';
      rm.textContent = t.rmBtn;
      (function(i){ rm.onclick = function(){ removeSlot(i); }; })(idx);
      row.appendChild(rm);
    }

    grid.appendChild(row);
  });

  var addBtn = document.getElementById('addBtn');
  addBtn.disabled = slots.length >= 4;
  addBtn.textContent = slots.length >= 4 ? t.addBtnMax : t.addBtn;
}

function onSearch(inp, idx) {
  var q = inp.value.trim().toLowerCase();
  var dd = document.getElementById('dd'+idx);
  if (!dd) return;

  var results = BOXERS.filter(function(b) {
    return q.length === 0 || b.name.toLowerCase().includes(q);
  }).slice(0, 10);

  dd.innerHTML = '';
  if (!results.length) { dd.classList.remove('open'); return; }

  results.forEach(function(b, i) {
    var item = document.createElement('div');
    item.className = 'dd-item';
    item.dataset.i = i;

    var nm = document.createElement('span');
    nm.className = 'dd-name';
    nm.textContent = b.name;

    var meta = document.createElement('div');
    meta.className = 'dd-meta';

    if (b.ret) {
      var ret = document.createElement('span');
      ret.className = 'dd-ret';
      ret.textContent = '🎖';
      meta.appendChild(ret);
    }

    var divSpan = document.createElement('span');
    divSpan.className = 'dd-div';
    divSpan.textContent = DIVS[b.div] ? DIVS[b.div][lang] : b.div;
    meta.appendChild(divSpan);

    item.appendChild(nm);
    item.appendChild(meta);

    (function(boxer, i_inner) {
      item.onmousedown = function(e) {
        e.preventDefault();
        slots[idx] = boxer;
        inp.value = boxer.name;
        dd.classList.remove('open');
        buildControls();
        renderCard();
      };
    })(b, i);

    dd.appendChild(item);
  });
  dd.classList.add('open');
}

function onKey(e, idx) {
  var dd = document.getElementById('dd'+idx);
  if (!dd || !dd.classList.contains('open')) return;
  var items = dd.querySelectorAll('.dd-item');
  var hi = dd.querySelector('.hi');
  var hiIdx = hi ? Array.from(items).indexOf(hi) : -1;
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (hi) hi.classList.remove('hi');
    items[Math.min(hiIdx+1, items.length-1)].classList.add('hi');
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (hi) hi.classList.remove('hi');
    if (hiIdx > 0) items[hiIdx-1].classList.add('hi');
  } else if (e.key === 'Enter' && hi) {
    hi.onmousedown({preventDefault:function(){}});
  } else if (e.key === 'Escape') {
    dd.classList.remove('open');
  }
}

function clearSlot(idx) {
  slots[idx] = null;
  buildControls();
  renderCard();
}

function addSlot() {
  if (slots.length >= 4) return;
  slots.push(null);
  buildControls();
}

function removeSlot(idx) {
  slots.splice(idx, 1);
  buildControls();
  renderCard();
}

// ── CARD RENDER ───────────────────────────────────────────────────────
function renderCard() {
  var active = [];
  slots.forEach(function(b, i){ if (b) active.push({boxer:b, colorIdx:i}); });

  var cols = document.getElementById('cols');
  var fNames = document.getElementById('fNames');
  var t = T[lang];

  if (active.length === 0) {
    cols.innerHTML = '<div class="empty" id="emptyMsg">'+t.emptyMsg+'</div>';
    fNames.innerHTML = '';
    return;
  }

  var maxH = Math.max.apply(null, active.map(function(a){ return a.boxer.h; }));
  var n = active.length;
  var barW = n===1?120 : n===2?88 : n===3?70 : 58;
  var nameFontSize = n<=2?'19px' : n===3?'15px' : '12px';
  var heightFontSize = n<=2?'22px' : '17px';

  // Build ruler
  var rulerHtml = '<div class="ruler">';
  var colsH = 240;
  var topPad = 34; // space for height text above bar
  [160,170,180,190,200,210].forEach(function(mark) {
    if (mark > maxH + 4) return;
    var barPx = Math.round((mark/maxH) * MAX_PX * 0.9);
    var topPx = colsH - barPx - topPad;
    if (topPx < 4) return;
    rulerHtml += '<div class="r-line" style="top:'+topPx+'px"></div>';
    rulerHtml += '<div class="r-lbl" style="top:'+topPx+'px">'+mark+'</div>';
  });
  rulerHtml += '</div>';

  // Build columns
  var colsHtml = rulerHtml;
  active.forEach(function(a, pos) {
    var b = a.boxer;
    var ci = a.colorIdx;
    var color = 'var('+COLORS[ci]+')';
    var px = Math.round((b.h/maxH) * MAX_PX * 0.9);
    var gradDark = ci===0?'#6b1208' : ci===1?'#0a1f30' : ci===2?'#0b3d1e' : '#2d0f4a';

    colsHtml += '<div class="col-wrap">';
    colsHtml += '<div class="col-h" style="color:'+color+';font-size:'+heightFontSize+'">'+b.h+' см</div>';
    colsHtml += '<div class="col-bar" id="bar'+ci+'" style="width:'+barW+'px;height:0px;background:linear-gradient(to top,'+gradDark+','+color+');box-shadow:0 0 28px '+color+'33;"></div>';
    colsHtml += '</div>';

    if (pos < active.length-1) {
      var next = active[pos+1];
      var diff = next.boxer.h - b.h;
      var diffTxt = diff===0 ? '=' : (diff>0?'▲+':'▼')+Math.abs(diff)+' см';
      colsHtml += '<div class="vs-gap"><div class="vs-lbl">VS</div><div class="vs-diff">'+diffTxt+'</div></div>';
    }
  });

  cols.innerHTML = colsHtml;

  // Animate bars
  setTimeout(function() {
    active.forEach(function(a) {
      var ci = a.colorIdx;
      var px = Math.round((a.boxer.h/maxH) * MAX_PX * 0.9);
      var el = document.getElementById('bar'+ci);
      if (el) el.style.height = px+'px';
    });
  }, 60);

  // Fighter names
  var namesHtml = '';
  active.forEach(function(a) {
    var b = a.boxer;
    var ci = a.colorIdx;
    var color = 'var('+COLORS[ci]+')';
    var divName = DIVS[b.div] ? DIVS[b.div][lang] : b.div;
    var retStr = b.ret ? ' · 🎖' : '';
    namesHtml += '<div class="f-block">';
    namesHtml += '<div class="f-n" style="color:'+color+';font-size:'+nameFontSize+'">'+b.name+'</div>';
    namesHtml += '<div class="f-sub">'+b.h+' см · '+divName+retStr+'</div>';
    namesHtml += '</div>';
  });
  fNames.innerHTML = namesHtml;
}

// ── SHARE ─────────────────────────────────────────────────────────────
function shareCard() {
  var btn = document.getElementById('shareBtn');
  btn.disabled = true;
  btn.textContent = '...';

  var el = document.getElementById('shareCard');
  html2canvas(el, {
    backgroundColor:'#111',
    scale:2,
    useCORS:true,
    logging:false
  }).then(function(canvas) {
    var link = document.createElement('a');
    link.download = 'boxing12x3-compare.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
    btn.disabled = false;
    btn.textContent = T[lang].shareBtn;
  }).catch(function() {
    btn.disabled = false;
    btn.textContent = T[lang].shareBtn;
  });
}

  var params = new URLSearchParams(window.location.search);

  // Default: Usyk vs Fury
  slots[0] = BOXERS.find(function(b){ return b.id==='usyk'; });
  slots[1] = BOXERS.find(function(b){ return b.id==='fury'; });

  setLang(lang);
}
