.slot-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:start;}
.slot-inner{position:relative;flex:1;}
.slot-label{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;margin-bottom:5px;display:block;}
.slot-input{width:100%;padding:9px 32px 9px 10px;border:0.5px solid var(--border);border-radius:6px;font-family:'DM Sans',sans-serif;font-size:13px;background:var(--bg);color:var(--text);outline:none;}
.slot-input:focus{border-color:#aaa;}
.slot-clear{position:absolute;right:8px;top:33px;background:none;border:none;cursor:pointer;color:var(--muted);font-size:16px;line-height:1;display:none;padding:2px;}
.has-val .slot-clear{display:block;}
.dd{position:absolute;top:calc(100% + 3px);left:0;right:0;background:var(--card);border:0.5px solid var(--border);border-radius:8px;box-shadow:0 4px 20px rgba(0,0,0,.1);z-index:100;max-height:220px;overflow-y:auto;display:none;}

.dd-item{padding:8px 12px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;border-bottom:0.5px solid #f5f3ef;}
.dd-item:last-child{border-bottom:none;}
.dd-item:hover,.dd-item.hi{background:#faf9f7;}
.dd-name{font-size:13px;font-weight:500;}
.dd-meta{display:flex;align-items:center;gap:5px;}
.dd-ret{font-size:12px;}
.dd-div{font-size:10px;color:var(--muted);}
.search-hint{font-size:11px;color:var(--muted);margin-top:5px;}
.rm-btn{background:none;border:0.5px solid var(--border);border-radius:5px;color:var(--muted);font-size:12px;cursor:pointer;padding:4px 8px;white-space:nowrap;font-family:'DM Sans',sans-serif;margin-top:22px;}
.rm-btn:hover{border-color:var(--red);color:var(--red);}
.add-btn{width:100%;margin-top:8px;padding:9px;border:0.5px dashed var(--border);border-radius:6px;background:transparent;color:var(--muted);font-size:13px;cursor:pointer;font-family:'DM Sans',sans-serif;}
.add-btn:hover:not(:disabled){border-color:#888;color:var(--text);}
.add-btn:disabled{opacity:.35;cursor:not-allowed;}
.sharecard{background:#111;border-radius:var(--r);overflow:hidden;position:relative;box-shadow:0 4px 28px rgba(0,0,0,.18);margin-bottom:10px;}

.col-bar::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(180deg,transparent,transparent 9px,rgba(0,0,0,.07) 9px,rgba(0,0,0,.07) 10px);}

var lang='uk', slots=[null,null], COLORS=['--c0','--c1','--c2','--c3'], MAX_PX=220;

function setLang(l){
  lang=l;
  document.getElementById('btnUk').className='lang-btn'+(l==='uk'?' on':'');
  document.getElementById('btnEn').className='lang-btn'+(l==='en'?' on':'');
  document.documentElement.lang=l==='uk'?'uk':'en';
  var t=T[l];
  document.getElementById('brandSub').textContent=t.brandSub;
  document.getElementById('pageTitle').textContent=t.pageTitle;
  document.getElementById('pageDesc').textContent=t.pageDesc;
  document.getElementById('cardBadge').textContent=t.cardBadge;
  document.getElementById('addBtn').textContent=slots.length>=4?t.addBtnMax:t.addBtn;
  document.getElementById('shareBtn').textContent=t.shareBtn;
  document.getElementById('shareNote').textContent=t.shareNote;
  document.getElementById('fHome').textContent=t.pageTitle==='Boxing Height Comparison'?'Scorecard':'Картка';
  document.getElementById('fGuide').textContent=t.pageTitle==='Boxing Height Comparison'?'Guide':'Довідник';
  buildControls(); renderCard();
}

function buildControls(){
  var t=T[lang], grid=document.getElementById('slotsGrid');
  grid.innerHTML='';
  slots.forEach(function(boxer,idx){
    var row=document.createElement('div'); row.className='slot-row';
    var inner=document.createElement('div'); inner.className='slot-inner'+(boxer?' has-val':'');
    var lbl=document.createElement('label'); lbl.className='slot-label'; lbl.style.color='var('+COLORS[idx]+')'; lbl.textContent=t.slotLabel[idx];
    var inp=document.createElement('input'); inp.type='text'; inp.className='slot-input'; inp.placeholder=t.ph; inp.value=boxer?boxer.name:''; inp.dataset.idx=idx;
    var clr=document.createElement('button'); clr.className='slot-clear'; clr.textContent='x'; (function(i){clr.onclick=function(){clearSlot(i);};})(idx);
    var dd=document.createElement('div'); dd.className='dd'; dd.id='dd'+idx;
    var hint=document.createElement('div'); hint.className='search-hint'; hint.id='hint'+idx; hint.textContent=t.hint; if(boxer)hint.style.display='none';
    inp.addEventListener('input',function(){
      var h=document.getElementById('hint'+idx); if(h)h.style.display=this.value?'none':'';
      inner.className='slot-inner'+(this.value?' has-val':'');
      onSearch(this,idx);
    });
    inp.addEventListener('focus',function(){onSearch(this,idx);});
    inp.addEventListener('blur',function(){setTimeout(function(){var d=document.getElementById('dd'+idx);if(d)d.classList.remove('open');},200);});
    inp.addEventListener('keydown',function(e){onKey(e,idx);});
    inner.appendChild(lbl); inner.appendChild(inp); inner.appendChild(clr); inner.appendChild(dd); inner.appendChild(hint);
    row.appendChild(inner);
    if(idx>=2){var rm=document.createElement('button'); rm.className='rm-btn'; rm.textContent=t.rmBtn; (function(i){rm.onclick=function(){removeSlot(i);};})(idx); row.appendChild(rm);}
    grid.appendChild(row);
  });
  var ab=document.getElementById('addBtn'); ab.disabled=slots.length>=4; ab.textContent=slots.length>=4?t.addBtnMax:t.addBtn;
}

function onSearch(inp,idx){
  var q=inp.value.trim().toLowerCase(), dd=document.getElementById('dd'+idx);
  if(!dd||q.length<2){if(dd)dd.classList.remove('open'); return;}
  var res=BOXERS.filter(function(b){return b.name.toLowerCase().includes(q);});
  res.sort(function(a,b){return (a.name.toLowerCase().startsWith(q)?0:1)-(b.name.toLowerCase().startsWith(q)?0:1);});
  res=res.slice(0,10);
  dd.innerHTML='';
  if(!res.length){dd.classList.remove('open'); return;}
  res.forEach(function(b){
    var item=document.createElement('div'); item.className='dd-item';
    var nm=document.createElement('span'); nm.className='dd-name'; nm.textContent=b.name;
    var meta=document.createElement('div'); meta.className='dd-meta';
    if(b.ret){var ret=document.createElement('span'); ret.className='dd-ret'; ret.textContent='🎖'; meta.appendChild(ret);}
    var divs=document.createElement('span'); divs.className='dd-div'; divs.textContent=DIVS[b.div]?DIVS[b.div][lang]:b.div; meta.appendChild(divs);
    item.appendChild(nm); item.appendChild(meta);
    (function(boxer){item.onmousedown=function(e){e.preventDefault(); slots[idx]=boxer; buildControls(); renderCard();};})(b);
    dd.appendChild(item);
  });
  dd.classList.add('open');
}

function onKey(e,idx){
  var dd=document.getElementById('dd'+idx); if(!dd||!dd.classList.contains('open'))return;
  var items=dd.querySelectorAll('.dd-item'), hi=dd.querySelector('.hi'), hiIdx=hi?Array.from(items).indexOf(hi):-1;
  if(e.key==='ArrowDown'){e.preventDefault(); if(hi)hi.classList.remove('hi'); items[Math.min(hiIdx+1,items.length-1)].classList.add('hi');}
  else if(e.key==='ArrowUp'){e.preventDefault(); if(hi)hi.classList.remove('hi'); if(hiIdx>0)items[hiIdx-1].classList.add('hi');}
  else if(e.key==='Enter'&&hi){hi.onmousedown({preventDefault:function(){}});}
  else if(e.key==='Escape'){dd.classList.remove('open');}
}

function clearSlot(idx){slots[idx]=null; buildControls(); renderCard();}
function addSlot(){if(slots.length>=4)return; slots.push(null); buildControls();}
function removeSlot(idx){slots.splice(idx,1); buildControls(); renderCard();}

function renderCard(){
  var active=[]; slots.forEach(function(b,i){if(b)active.push({boxer:b,ci:i});});
  var cols=document.getElementById('cols'), fNames=document.getElementById('fNames'), t=T[lang];
  if(!active.length){cols.innerHTML='<div class="empty">'+t.emptyMsg+'</div>'; fNames.innerHTML=''; return;}
  var maxH=Math.max.apply(null,active.map(function(a){return a.boxer.h;}));
  var n=active.length, barW=n===1?120:n===2?88:n===3?70:58, nameFSz=n<=2?'19px':n===3?'15px':'12px', hFSz=n<=2?'22px':'17px';
  var CH=240, pad=34, rHtml='<div class="ruler">';
  [160,170,180,190,200,210].forEach(function(m){
    if(m>maxH+4)return;
    var px=Math.round((m/maxH)*MAX_PX*0.9), top=CH-px-pad; if(top<4)return;
    rHtml+='<div class="r-line" style="top:'+top+'px"></div><div class="r-lbl" style="top:'+top+'px">'+m+'</div>';
  });
  rHtml+='</div>';
  var cHtml=rHtml;
  active.forEach(function(a,pos){
    var b=a.boxer, ci=a.ci, color='var('+COLORS[ci]+')', px=Math.round((b.h/maxH)*MAX_PX*0.9);
    var gd=ci===0?'#6b1208':ci===1?'#0a1f30':ci===2?'#0b3d1e':'#2d0f4a';
    cHtml+='<div class="col-wrap"><div class="col-h" style="color:'+color+';font-size:'+hFSz+'">'+b.h+' cm</div>';
    cHtml+='<div class="col-bar" id="bar'+ci+'" style="width:'+barW+'px;height:0;background:linear-gradient(to top,'+gd+','+color+');box-shadow:0 0 28px '+color+'33"></div></div>';
    if(pos<active.length-1){var next=active[pos+1],diff=next.boxer.h-b.h,dt=diff===0?'=':(diff>0?'+':'')+diff+' cm'; cHtml+='<div class="vs-gap"><div class="vs-lbl">VS</div><div class="vs-diff">'+dt+'</div></div>';}
  });
  cols.innerHTML=cHtml;
  setTimeout(function(){active.forEach(function(a){var el=document.getElementById('bar'+a.ci); if(el)el.style.height=Math.round((a.boxer.h/maxH)*MAX_PX*0.9)+'px';});},60);
  var nHtml='';
  active.forEach(function(a){
    var b=a.boxer, color='var('+COLORS[a.ci]+')', dn=DIVS[b.div]?DIVS[b.div][lang]:b.div;
    nHtml+='<div class="f-block"><div class="f-n" style="color:'+color+';font-size:'+nameFSz+'">'+b.name+'</div><div class="f-sub">'+b.h+' cm · '+dn+(b.ret?' · 🎖':'')+'</div></div>';
  });
  fNames.innerHTML=nHtml;
}

function shareCard(){
  var btn=document.getElementById('shareBtn'); btn.disabled=true; btn.textContent='...';
  html2canvas(document.getElementById('shareCard'),{backgroundColor:'#111',scale:2,useCORS:true,logging:false}).then(function(canvas){
    var a=document.createElement('a'); a.download='boxing12x3-compare.png'; a.href=canvas.toDataURL('image/png'); a.click();
    btn.disabled=false; btn.textContent=T[lang].shareBtn;
  }).catch(function(){btn.disabled=false; btn.textContent=T[lang].shareBtn;});
}

function init(){
  var p=new URLSearchParams(window.location.search);
  if(p.get('lang')==='en')lang='en';
  slots[0]=BOXERS.find(function(b){return b.id==='usyk';});
  slots[1]=BOXERS.find(function(b){return b.id==='fury';});
  setLang(lang);
}
document.addEventListener('DOMContentLoaded',init);
</script>
