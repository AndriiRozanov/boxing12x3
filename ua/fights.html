<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Архів боїв – статистика та аналіз | Boxing 12×3</title>
<meta name="description" content="Архів боїв з детальною статистикою, аналізом та суддівськими картками. Всі матеріали Boxing 12×3.">
<link rel="canonical" href="https://boxing12x3.com/ua/fights">
<link rel="alternate" hreflang="uk" href="https://boxing12x3.com/ua/fights">
<link rel="alternate" hreflang="en" href="https://boxing12x3.com/en/fights">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='14' fill='%23111'/%3E%3Ctext x='50' y='38' font-family='Georgia,serif' font-size='36' font-weight='700' fill='white' text-anchor='middle'%3E12%3C/text%3E%3Cline x1='18' y1='52' x2='82' y2='52' stroke='%23c0392b' stroke-width='3'/%3E%3Ctext x='50' y='72' font-family='Georgia,serif' font-size='30' font-weight='700' fill='white' text-anchor='middle' letter-spacing='3'%3E%C3%973%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,400;0,500;0,700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --red:#c0392b;--blue:#1a5276;--bg:#f7f6f3;--card:#fff;
  --text:#1a1a1a;--muted:#888;--border:#e5e3de;--r:10px;
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);padding:1.5rem 1rem 4rem;line-height:1.6;}
.wrap{max-width:620px;margin:0 auto;}
.lang-row{display:flex;justify-content:flex-end;gap:4px;margin-bottom:1rem;}
.lang-btn{font-size:11px;font-weight:500;padding:4px 10px;border-radius:20px;border:0.5px solid var(--border);background:transparent;color:var(--muted);text-decoration:none;}
.lang-btn.on{background:var(--text);color:#fff;border-color:var(--text);}
.brand{text-align:center;margin-bottom:1.5rem;}
.brand a{text-decoration:none;}
.brand-name{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:.12em;color:var(--text);}
.brand-sub{font-size:10px;color:var(--muted);letter-spacing:.18em;text-transform:uppercase;margin-top:1px;}
h1{font-size:22px;font-weight:700;margin-bottom:6px;}
.page-sub{font-size:13px;color:var(--muted);margin-bottom:24px;padding-bottom:20px;border-bottom:0.5px solid var(--border);}
/* Accordion */
.month-block{margin-bottom:8px;}
.month-header{
  display:flex;align-items:center;justify-content:space-between;
  background:var(--card);border:0.5px solid var(--border);
  border-radius:var(--r);padding:13px 16px;
  cursor:pointer;user-select:none;
  transition:background .15s;
}
.month-header:hover{background:#f0ede8;}
.month-header.open{border-bottom-left-radius:0;border-bottom-right-radius:0;border-bottom-color:transparent;}
.month-title{font-size:14px;font-weight:600;}
.month-count{font-size:12px;color:var(--muted);}
.month-arr{font-size:16px;color:var(--muted);transition:transform .2s;}
.month-header.open .month-arr{transform:rotate(90deg);}
.month-body{
  display:none;
  background:var(--card);
  border:0.5px solid var(--border);border-top:none;
  border-bottom-left-radius:var(--r);border-bottom-right-radius:var(--r);
  overflow:hidden;
}
.month-body.open{display:block;}
.fight-link{
  display:flex;align-items:center;justify-content:space-between;
  padding:11px 16px;border-top:0.5px solid var(--border);
  text-decoration:none;color:var(--text);font-size:13px;font-weight:500;
  transition:background .15s;
}
.fight-link:first-child{border-top:none;}
.fight-link:hover{background:var(--bg);}
.fight-link-right{display:flex;align-items:center;gap:8px;}
.fight-date{font-size:11px;color:var(--muted);}
.fight-arr{font-size:14px;color:var(--muted);}
.back{text-align:center;margin-top:28px;}
.back a{font-size:13px;color:var(--red);font-weight:500;text-decoration:none;}

/* Site footer */
.site-footer{text-align:center;padding:24px 0 8px;font-size:12px;color:var(--muted);}
.site-footer a{color:var(--muted);text-decoration:none;}
.site-footer a:hover{color:var(--red);}
</style>
</head>
<body>
<div class="wrap">

  <div class="lang-row">
    <span class="lang-btn on">UA</span>
    <a class="lang-btn" href="/en/fights">EN</a>
  </div>

  <div class="brand">
    <a href="/?lang=uk">
      <div class="brand-name">BOXING 12×3</div>
      <div class="brand-sub">Суддівська картка</div>
    </a>
  </div>

  <h1>Архів боїв</h1>
  <div class="page-sub">Статистика та аналіз протистоянь</div>

  <div id="archive"></div>

  <div class="back">
    <a href="/?lang=uk">← На головну</a>
  </div>

</div>
<script>
// ── Дані боїв ─────────────────────────────────────────────────────────────
// Додавати нові бої на початок відповідного місяця.
// Формат: {month, year, fights: [{id, nameUk, dateUk}]}
const ARCHIVE = [
  {
    month: 'Липень', year: 2026,
    fights: [
      {id:'mason-bell', nameUk:'Абдулла Мейсон – Альберт Белл', dateUk:'5 липня'},
      {id:'joshua-prenga', nameUk:'Ентоні Джошуа – Крістіан Пренга', dateUk:'25 липня'},
    ]
  },
  {
    month: 'Червень', year: 2026,
    fights: [
      {id:'zayas-ennis',           nameUk:'Ксандер Заяс – Джарон Енніс',       dateUk:'27 червня'},
      {id:'crocker-paro',          nameUk:'Льюїс Крокер – Ліам Паро',           dateUk:'24 червня'},
      {id:'rodriguez-vargas',      nameUk:'Джессі Родрігес – Антоніо Варгас',   dateUk:'13 червня'},
      {id:'billam-smith-rozicki',  nameUk:'Кріс Біллем-Сміт – Раян Розицький', dateUk:'6 червня'},
      {id:'nery-casimero',         nameUk:'Луїс Нері – Джон Касімеро',          dateUk:'6 червня'},
      {id:'garcia-moloney',        nameUk:'Віллібальдо Гарсія – Ендрю Молоні', dateUk:'6 червня'},
    ]
  },
  // Наступний місяць – додати блок вище:
  // {
  //   month: 'Липень', year: 2026,
  //   fights: [
  //     {id:'fight-id', nameUk:'Боєць – Боєць', dateUk:'5 липня'},
  //   ]
  // },
];

// ── Рендер ────────────────────────────────────────────────────────────────
function build() {
  const container = document.getElementById('archive');
  ARCHIVE.forEach(function(block, idx) {
    const id = 'month-' + idx;
    const isOpen = idx === 0;
    const div = document.createElement('div');
    div.className = 'month-block';
    div.innerHTML =
      '<div class="month-header' + (isOpen ? ' open' : '') + '" onclick="toggle(\'' + id + '\')">' +
        '<span class="month-title">' + block.month + ' ' + block.year + '</span>' +
        '<span class="month-right" style="display:flex;align-items:center;gap:10px;">' +
          '<span class="month-count">' + block.fights.length + ' ' + pluralUk(block.fights.length) + '</span>' +
          '<span class="month-arr">›</span>' +
        '</span>' +
      '</div>' +
      '<div class="month-body' + (isOpen ? ' open' : '') + '" id="' + id + '">' +
        block.fights.map(function(f) {
          return '<a class="fight-link" href="/ua/' + f.id + '">' +
            '<span>' + f.nameUk + '</span>' +
            '<span class="fight-link-right">' +
              '<span class="fight-date">' + f.dateUk + '</span>' +
              '<span class="fight-arr">›</span>' +
            '</span>' +
          '</a>';
        }).join('') +
      '</div>';
    container.appendChild(div);
  });
}

function toggle(id) {
  var body = document.getElementById(id);
  var header = body.previousElementSibling;
  body.classList.toggle('open');
  header.classList.toggle('open');
}

function pluralUk(n) {
  if (n === 1) return 'бій';
  if (n >= 2 && n <= 4) return 'бої';
  return 'боїв';
}

build();
</script>
</body>
</html>
