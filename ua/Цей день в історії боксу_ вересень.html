{y:1998,t:"Помер Біллі Сус у віці 83 років",p:"",x:"Американський боксер, чемпіон світу у середній вазі 1941 року. Суз був зображений на обкладинці журналу «Ринг» за червень 1941 року. Він є членом Міжнародної зали боксерської слави з 2009 року. Він також є героєм книги «Біллі Сус - чемпіон, якого забув час». Суса знайшли мертвим у його будинку в Тафтоні, штат Пенсільванія, у 1998 році."},
{y:2026,t:"<a class='boxer-link' href='/height-compare?a=ruiz&lang=uk'>Енді Руїс</a>-мол програв UD 12 Даміану Книбі",p:"Ньюарк, США",x:"Напередодні двобою Руїс заважив 115,3 кг. Книба показав на вагах 115,8 кг. Для Енді Руїса це було повернення на ринг після дворічної перерви, яка виникла через травму, отриману у протистоянні проти Джаррелла Міллера. Книба повертався після дострокової поразки від Агіта Кабаєла. Поляк програв німцю за три раунди, а у бою-поверненні перебоксував ексчемпіона рішенням суддів двічі 114-113 та 117-110. У 7 раунді Руїс побував у нокдауні."}
]},
{d:7,events:[
{y:1894,t:"Едісон зняв на плівку демонстраційний поєдинок Корбетта й Кортні",p:"",x:"Томас Едісон зняв на плівку демонстраційний поєдинок чемпіона світу важкої ваги Джеймса Джея Корбетта й Пітера Кортні. За угодою Корбетт нокаутує суперника у 6 раунді. Фільм знімали виключно у Нью-Джерсі, у місті Вест-Орандж, на території першої у світі кіностудії «Чорна Марія». Тодішні камери вміщували котушки плівки завдовжки лише 150 футів (близько 45 метрів), тому кожен раунд тривав рівно одну хвилину, після чого зйомку зупиняли для перезаряджання камери. Бій не був офіційним захистом титулу - це був демонстраційний поєдинок за фінансову винагороду. Кожен раунд продавався клієнтам як окремий мініфільм (ціна одного раунду в каталогах становила $45). Глядач мав кинути монету в автомат - кінетоскоп - щоб подивитися один раунд. У кутах боксерів в якості секундантів перебували легендарний боксер та тренер Вільям Малдун, а також популярний актор театру Моріс Беррімор."},
{y:1908,t:"Біллі Папке ТКО 12/25 Стенлі Кетчел",p:"Вернон, Каліфорнія, США",x:"Титул чемпіона світу у середній вазі. В «Atlanta Constitution» про поєдинок згадується: «Коли рефері Джеффріс оголосив про закінчення раунду, і Кетчел підійшов до центру рингу, простягнувши руку для рукостискання, Папке проігнорував цей жест і кинувся на боксера з Мічигану». Проте жодна газета Лос-Анджелеса не повідомляла, що Папке завдав удару в момент, коли Кетчел простягнув руку. Більшість джерел повідомляють, що насправді саме Кетчел завдав першого удару."},
{y:1990,t:"<a class='boxer-link' href='/height-compare?a=bowe&lang=uk'>Ріддік Боу</a> RTD 8 Піклон Томас",p:"",x:"Кут Томаса відмовився від продовження після 8 раунду двобою."},
{y:1996,t:"<a class='boxer-link' href='/height-compare?a=tyson&lang=uk'>Майк Тайсон</a> ТКО 1 Брюс Селдон",p:"",x:"Цей двобій став останнім для Майка перед дилогією проти Холіфілда. Вже за два місяці Тайсон вперше зустрівся з Евандером та був нокаутований в 11 раунді. А у 1997-му Тайсон вдруге програв Холіфілду достроково."},
{y:1999,t:"Помер Томас Амеріко у Ділі",p:"",x:"Професійний боксер зі Східного Тимору. Він виграв титул чемпіона світу у напівлегкій вазі Східної та Тихоокеанської боксерської федерації лише у своєму другому зареєстрованому професійному бою. У третьому поєдинку він став першим індонезійським бійцем, який боровся за титул чемпіона світу, коли він бився з чемпіоном світу за версією WBC Саулом Мамбі. Амеріко - перший індонезієць, який боровся за титул чемпіона світу, і перший боксер зі Східного Тимору, який боровся за пояс чемпіона світу. Протягом останніх днів індонезійської окупації Східного Тимору на вулицях Ділі відбувалися акти насильства. Амеріко став жертвою одного з них - його витягли з машини та застрелили ополченці 7 вересня 1999 року, незадовго до того, як Східний Тимор здобув незалежність."},
{y:2005,t:"Помер Ніколіно Лоче",p:"",x:"Ексчемпіон світу та один із найкращих боксерів-майстрів захисту усіх часів помер у Лас-Ерасі від інфаркту міокарда."}
]},

{y:2017,t:"<a class='boxer-link' href='/height-compare?a=usyk&lang=uk'>Олександр Усик</a> ТКО 10 Марко Хук",p:"Берлін, Німеччина",x:"Перший поєдинок Всесвітньої суперсерії, на кону якої стояло абсолютне чемпіонство у крузервейті та Кубок Мухаммеда Алі. Усик сам обрав Хука в суперники - українець виграв жеребкування та обирав опонента першим. Напередодні Хук штовхнув Усика під час офіційного заходу та негативно висловився щодо матері Олександра; пізніше переможець відзначав, що хотів не просто перемогти, а знатно побити суперника за це. У цьому протистоянні саме Усик був чемпіоном - володів титулом WBO, здобутим у протистоянні проти Кшиштофа Гловацького у 2016-му, коли став першим, хто побив поляка. Після цього українець двічі захищав титул - перемагав Табісо Мчуну та Майкла Хантера."}

      var e = document.createElement('div');
      e.className = 'event';
      var html = '<div class="event-year">' + ev.y + '</div>';
      html += '<h3 class="event-title">' + ev.t + '</h3>';
      if(ev.p) html += '<div class="event-place">' + ev.p + '</div>';
      if(ev.v) html += '<div class="video-embed" data-vid="' + ev.v + '"><img src="https://img.youtube.com/vi/' + ev.v + '/hqdefault.jpg" alt="' + ev.t + ' - відео"><div class="video-play"></div></div>';
      if(ev.x) html += '<div class="event-body">' + ev.x + '</div>';
      if(ev.photo) html += '<div class="hist-photo"><img src="' + ev.photo.src + '" alt="' + ev.photo.alt + '" loading="lazy"><div class="hist-photo-cap">Фото: ' + ev.photo.srcUk + '</div></div>';
      if(ev.img) html += '<div class="hist-photo"><img src="' + ev.img.src + '" alt="' + ev.img.alt + '" loading="lazy"><div class="tool-cta"><div class="tool-cta-text">' + ev.img.cta + '</div><a class="tool-cta-btn" href="' + ev.img.href + '">Порівняти зрости →</a></div></div>';
      if(ev.live) html += '<div class="live-widget"><div class="live-widget-intro">' + ev.live.intro + '</div><iframe src="' + ev.live.src + '" loading="lazy" title="Суддівська картка"></iframe></div>';
      e.innerHTML = html;
      block.appendChild(e);
    });

    content.appendChild(block);
  });

  // Build the 30-cell calendar strip. Days with no content (e.g. Sep 6) are
  // permanently muted/non-clickable - never treated as "current" or "passed".
  var calCells = {};
  for(var n=1;n<=30;n++){
    var hasEvent = eventDayNums.indexOf(n) > -1;
    var c = document.createElement('div');
    c.className = 'cal-cell' + (hasEvent ? ' has-event' : ' no-event');
    c.textContent = n;
    if(hasEvent){
      c.addEventListener('click', function(day){
        return function(){ document.getElementById('d'+day).scrollIntoView({behavior:'smooth', block:'start'}); };
      }(n));
    }
    calRow.appendChild(c);
    calCells[n] = c;
  }

  var activeDay = -1;
  function renderCal(day){
    if(day === activeDay) return;
    activeDay = day;
    for(var n=1;n<=30;n++){
      var el = calCells[n];
      if(eventDayNums.indexOf(n) === -1) continue; // no-event cells keep their fixed muted style
      el.classList.remove('passed','active');
      if(n < day) el.classList.add('passed');
      else if(n === day) el.classList.add('active');
    }
    progLabel.textContent = day + ' / 30';
    calCells[day].scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'});
  }

  // Active-day detection: compare each day header's position against the
  // bottom edge of the sticky calendar bar (not a fixed pixel guess), so it
  // adapts if the bar's own height ever changes.
  function updateActive(){
    var ref = calBar.getBoundingClientRect().bottom + 8;
    var best = 0;
    for(var i=0;i<dayIds.length;i++){
      var rect = document.getElementById(dayIds[i]).getBoundingClientRect();
      if(rect.top <= ref){ best = i; } else { break; }
    }
    renderCal(DAYS[best].d);
  }
  window.addEventListener('scroll', updateActive, {passive:true});
  window.addEventListener('resize', updateActive);
  updateActive();

  content.addEventListener('click', function(e){
    var box = e.target.closest('.video-embed');
    if(!box) return;
    var vid = box.getAttribute('data-vid');
    box.innerHTML = '<iframe src="https://www.youtube.com/embed/' + vid + '?autoplay=1" title="YouTube video" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>';
  });
})();
</script>
</body>
</html>
