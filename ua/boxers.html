// Порядок і назви дивізіонів – за нашою довідковою таблицею категорій.
const DIV_ORDER = ['hw','cw','lhw','smw','mw','sww','ww','slw','lw','sfw','fw','sbw','bw','sfl','fl','lfl','mfw'];
const DIV_NAMES_UK = {mfw:'Мінімальна',lfl:'Перша найлегша',fl:'Найлегша',sfl:'Друга найлегша',bw:'Легша',sbw:'Друга легша',fw:'Напівлегка',sfw:'Друга напівлегка',lw:'Легка',slw:'Перша напівсередня',ww:'Напівсередня',sww:'Перша середня',mw:'Середня',smw:'Друга середня',lhw:'Напівважка',cw:'Важка',hw:'Надважка'};

// ── Рендер ────────────────────────────────────────────────────────────────
function build() {
  var groups = {};
  BOXER_PROFILES.forEach(function(p){ (groups[p.div] = groups[p.div] || []).push(p); });
  var divs = DIV_ORDER.filter(function(d){ return groups[d] && groups[d].length; });
  if (!divs.length) return;
  var openDiv = divs.reduce(function(best, d){ return groups[d].length > groups[best].length ? d : best; }, divs[0]);

  var container = document.getElementById('catalog');
  divs.forEach(function(d, idx) {
    var id = 'div-' + d;
    var isOpen = d === openDiv;
    var block = document.createElement('div');
    block.className = 'div-block';
    block.innerHTML =
      '<div class="div-header' + (isOpen ? ' open' : '') + '" onclick="toggle(\'' + id + '\')">' +
        '<h2 class="div-title">' + DIV_NAMES_UK[d] + '</h2>' +
        '<span style="display:flex;align-items:center;gap:10px;">' +
          '<span class="div-count">' + groups[d].length + ' ' + plural(groups[d].length) + '</span>' +
          '<span class="div-arr">›</span>' +
        '</span>' +
      '</div>' +
      '<div class="div-body' + (isOpen ? ' open' : '') + '" id="' + id + '">' +
        groups[d].map(function(p) {
          return '<a class="boxer-link" href="/ua/boxers/' + p.slug + '">' +
            '<span class="boxer-name">' + p.nameUk +
              (p.org ? ' <span class="boxer-chip" style="background:' + p.orgColor + '">' + p.org + '</span>' : '') +
            '</span>' +
            '<span class="boxer-arr">›</span>' +
          '</a>';
        }).join('') +
      '</div>';
    container.appendChild(block);
  });
}

function toggle(id) {
  var body = document.getElementById(id);
  var header = body.previousElementSibling;
  body.classList.toggle('open');
  header.classList.toggle('open');
}

function plural(n) {
  if (n === 1) return 'боксер';
  if (n >= 2 && n <= 4) return 'боксери';
  return 'боксерів';
}

build();
