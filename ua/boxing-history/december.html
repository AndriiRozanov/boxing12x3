(function(){
  var content = document.getElementById('content');
  var calRow = document.getElementById('calRow');
  var calBar = document.getElementById('calBar');
  var progLabel = document.getElementById('progLabel');
  var dayIds = [];
  var eventDayNums = [];

  DAYS.forEach(function(day){
    var id = 'd' + day.d;
    dayIds.push(id);
    eventDayNums.push(day.d);

    var block = document.createElement('div');
    block.className = 'day-block';
    block.id = id;
    var h2 = document.createElement('div');
    h2.className = 'day-h2';
    h2.innerHTML = '<time datetime="2026-12-' + String(day.d).padStart(2,'0') + '">' + day.d + ' грудня</time>';
    block.appendChild(h2);

    day.events.forEach(function(ev){
      var e = document.createElement('div');
      e.className = 'event';
      var html = '<div class="event-year">' + ev.y + '</div>';
      html += '<h3 class="event-title">' + ev.t + '</h3>';
      if(ev.p) html += '<div class="event-place">' + ev.p + '</div>';
      if(ev.v) html += '<div class="video-embed" data-vid="' + ev.v + '"><img src="https://img.youtube.com/vi/' + ev.v + '/hqdefault.jpg" alt="' + ev.t.replace(/<[^>]+>/g,'') + ' - відео"><div class="video-play"></div></div>';
      if(ev.x) html += '<div class="event-body">' + ev.x + '</div>';
      if(ev.photo) html += '<div class="hist-photo"><img src="' + ev.photo.src + '" alt="' + ev.photo.alt + '" loading="lazy"><div class="hist-photo-cap">Фото: ' + ev.photo.srcUk + '</div></div>';
      if(ev.img) html += '<div class="hist-photo"><img src="' + ev.img.src + '" alt="' + ev.img.alt + '" loading="lazy"><div class="tool-cta"><div class="tool-cta-text">' + ev.img.cta + '</div><a class="tool-cta-btn" href="' + ev.img.href + '">Порівняти зрости →</a></div></div>';
      if(ev.live) html += '<div class="live-widget"><div class="live-widget-intro">' + ev.live.intro + '</div><iframe src="' + ev.live.src + '" loading="lazy" title="Суддівська картка"></iframe></div>';
      e.innerHTML = html;
      block.appendChild(e);
    });

    content.appendChild(block);
  });

  // Build the 30-cell calendar strip. Days with no content (e.g. Sep 6) are
  // permanently muted/non-clickable - never treated as "current" or "passed".
  var calCells = {};
  for(var n=1;n<=31;n++){
    var hasEvent = eventDayNums.indexOf(n) > -1;
    var c = document.createElement('div');
    c.className = 'cal-cell' + (hasEvent ? ' has-event' : ' no-event');
    c.textContent = n;
    if(hasEvent){
      c.addEventListener('click', function(day){
        return function(){ document.getElementById('d'+day).scrollIntoView({behavior:'smooth', block:'start'}); };
      }(n));
    }
    calRow.appendChild(c);
    calCells[n] = c;
  }

  var activeDay = -1;
  function renderCal(day){
    if(day === activeDay) return;
    activeDay = day;
    for(var n=1;n<=31;n++){
      var el = calCells[n];
      if(eventDayNums.indexOf(n) === -1) continue; // no-event cells keep their fixed muted style
      el.classList.remove('passed','active');
      if(n < day) el.classList.add('passed');
      else if(n === day) el.classList.add('active');
    }
    progLabel.textContent = day + ' / 31';
    calCells[day].scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'});
  }

  // Active-day detection: compare each day header's position against the
  // bottom edge of the sticky calendar bar (not a fixed pixel guess), so it
  // adapts if the bar's own height ever changes.
  function updateActive(){
    var ref = calBar.getBoundingClientRect().bottom + 8;
    var best = 0;
    for(var i=0;i<dayIds.length;i++){
      var rect = document.getElementById(dayIds[i]).getBoundingClientRect();
      if(rect.top <= ref){ best = i; } else { break; }
    }
    renderCal(DAYS[best].d);
  }
  window.addEventListener('scroll', updateActive, {passive:true});
  window.addEventListener('resize', updateActive);
  updateActive();

  content.addEventListener('click', function(e){
    var box = e.target.closest('.video-embed');
    if(!box) return;
    var vid = box.getAttribute('data-vid');
    box.innerHTML = '<iframe src="https://www.youtube.com/embed/' + vid + '?autoplay=1" title="YouTube video" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>';
  });
})();
</script>
<button type="button" class="totop" id="toTop" aria-label="Нагору"><span class="tt-in"><span class="tt-f"><svg class="tt-r" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="21" fill="none" stroke="#e5e3de" stroke-width="3"/><circle id="ttRing" cx="24" cy="24" r="21" fill="none" stroke="#111" stroke-width="3" stroke-linecap="round" stroke-dasharray="131.95" stroke-dashoffset="131.95"/></svg><span class="tt-core"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 13V3M3.5 7.5L8 3l4.5 4.5"/></svg></span></span><span class="tt-b"><span class="tt-core">12&times;3</span></span></span></button>
<script>
(function(){
  var b=document.getElementById('toTop'),ring=document.getElementById('ttRing');if(!b)return;
  var L={up:'Нагору',back:'Назад'},C=131.95,saved=null,savedP=0,lock=0,
      rm=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;
  function Y(){return window.scrollY||document.documentElement.scrollTop;}
  function prog(){var h=document.documentElement.scrollHeight-window.innerHeight;return h>0?Math.min(1,Math.max(0,Y()/h)):0;}
  function mode(back){b.classList.toggle('back',back);b.setAttribute('aria-label',back?L.back:L.up);}
  function upd(){
    var y=Y();
    if(saved!==null&&!lock&&y>200){saved=null;mode(false);}
    b.classList.toggle('show',y>600||saved!==null);
    ring.style.strokeDashoffset=C*(1-(saved!==null?savedP:prog()));
  }
  b.addEventListener('click',function(){
    var y=Y(),goUp=saved===null,target;
    lock=1;setTimeout(function(){lock=0;upd();},1300);
    if(goUp){saved=y;savedP=prog();target=0;}else{target=saved;saved=null;}
    if(!rm){b.classList.remove('spin');void b.offsetWidth;b.classList.add('spin');setTimeout(function(){mode(goUp);},420);setTimeout(function(){b.classList.remove('spin');},820);}
    else mode(goUp);
    window.scrollTo({top:target,behavior:'smooth'});
    upd();
  });
  window.addEventListener('scroll',upd,{passive:true});upd();
})();
</script>
