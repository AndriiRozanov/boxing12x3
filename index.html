<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boxing 12×3 — Scorecard</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='16' fill='%23111'/><text x='50' y='52' font-family='Georgia,serif' font-size='28' font-weight='700' fill='white' text-anchor='middle' dominant-baseline='middle' letter-spacing='1'>12%C3%973</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --red:#c0392b;
  --red-light:#fdf2f2;
  --red-border:#f5b7b1;
  --blue:#1a5276;
  --blue-light:#eaf4fb;
  --blue-border:#a9cce3;
  --bg:#f7f6f3;
  --card:#ffffff;
  --text:#1a1a1a;
  --text-muted:#888;
  --border:#e5e3de;
  --radius:10px;
}

body{
  font-family:'DM Sans',sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  padding:1.5rem 1rem 4rem;
}

.lang-bar{
  display:flex;
  justify-content:flex-end;
  gap:4px;
  max-width:520px;
  margin:0 auto 1.2rem;
}
.lang-btn{
  font-family:'DM Sans',sans-serif;
  font-size:11px;
  font-weight:500;
  padding:4px 10px;
  border-radius:20px;
  border:0.5px solid var(--border);
  background:transparent;
  color:var(--text-muted);
  cursor:pointer;
  letter-spacing:0.04em;
  transition:all 0.15s;
}
.lang-btn.active{
  background:var(--text);
  color:#fff;
  border-color:var(--text);
}

.site-brand{
  text-align:center;
  margin-bottom:1.5rem;
}
.site-brand-name{
  font-family:'Bebas Neue',sans-serif;
  font-size:28px;
  letter-spacing:0.12em;
  color:var(--text);
}
.site-brand-sub{
  font-size:10px;
  color:var(--text-muted);
  letter-spacing:0.18em;
  text-transform:uppercase;
  margin-top:1px;
}

.setup-card{
  background:var(--card);
  border:0.5px solid var(--border);
  border-radius:var(--radius);
  padding:1.2rem;
  max-width:520px;
  margin:0 auto 1.2rem;
}
.setup-title{
  font-size:11px;
  font-weight:500;
  color:var(--text-muted);
  letter-spacing:0.1em;
  text-transform:uppercase;
  margin-bottom:1rem;
}
.fighters-grid{
  display:grid;
  grid-template-columns:1fr 32px 1fr;
  gap:8px;
  align-items:center;
}
.vs-badge{
  text-align:center;
  font-family:'Bebas Neue',sans-serif;
  font-size:16px;
  color:var(--text-muted);
  letter-spacing:0.05em;
}
.fighter-input-wrap{}
.fighter-label{
  font-size:10px;
  font-weight:500;
  letter-spacing:0.08em;
  text-transform:uppercase;
  margin-bottom:4px;
  display:flex;
  align-items:center;
  gap:5px;
}
.dot-red{width:7px;height:7px;border-radius:50%;background:var(--red);display:inline-block;}
.dot-blue{width:7px;height:7px;border-radius:50%;background:var(--blue);display:inline-block;}
.fighter-input{
  width:100%;
  font-family:'DM Sans',sans-serif;
  font-size:13px;
  font-weight:500;
  color:var(--text);
  background:var(--bg);
  border:0.5px solid var(--border);
  border-radius:6px;
  padding:8px 10px;
  outline:none;
  transition:border-color 0.15s;
}
.fighter-input:focus{border-color:var(--text);}

.scorecard{
  max-width:520px;
  margin:0 auto;
  background:var(--card);
  border:0.5px solid var(--border);
  border-radius:var(--radius);
  overflow:hidden;
}

.sc-header{
  display:grid;
  grid-template-columns:1fr 60px 1fr;
  background:#111;
}
.sc-fighter{
  padding:12px 14px;
}
.sc-fighter.red{border-right:3px solid var(--red);}
.sc-fighter.blue{border-left:3px solid var(--blue);text-align:right;}
.sc-corner{font-size:9px;color:#666;text-transform:uppercase;letter-spacing:0.1em;}
.sc-name{font-size:14px;font-weight:500;color:#fff;margin-top:3px;font-family:'Bebas Neue',sans-serif;letter-spacing:0.06em;}
.sc-mid{
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  background:#0a0a0a;
  border-left:0.5px solid #1a1a1a;
  border-right:0.5px solid #1a1a1a;
  padding:6px 4px;
}
.sc-mid-brand{font-family:'Bebas Neue',sans-serif;font-size:13px;color:#fff;letter-spacing:0.08em;}
.sc-mid-sub{font-size:8px;color:#444;letter-spacing:0.12em;margin-top:1px;}

.sc-col-heads{
  display:grid;
  grid-template-columns:40px 1fr 28px 1fr 40px;
  gap:4px;
  padding:5px 10px;
  background:var(--bg);
  border-bottom:0.5px solid var(--border);
}
.sc-col-head{font-size:9px;color:var(--text-muted);letter-spacing:0.08em;text-transform:uppercase;text-align:center;}
.sc-col-head.r{color:var(--red);}
.sc-col-head.b{color:var(--blue);text-align:right;}

.rounds-list{}
.round-row{
  display:grid;
  grid-template-columns:40px 1fr 28px 1fr 40px;
  gap:4px;
  padding:5px 10px;
  align-items:center;
  border-bottom:0.5px solid var(--border);
  transition:background 0.1s;
}
.round-row:last-child{border-bottom:none;}
.round-row.scored{background:#fafaf8;}

.rnum{
  font-size:10px;
  color:var(--text-muted);
  text-align:center;
  font-weight:500;
}
.win-indicator{
  font-size:9px;
  font-weight:500;
  letter-spacing:0.06em;
  text-align:center;
}
.win-indicator.r{color:var(--red);}
.win-indicator.b{color:var(--blue);text-align:right;}
.win-indicator.draw{color:var(--text-muted);}

.score-select-wrap{position:relative;}
.score-bar{
  height:28px;
  border-radius:4px;
  display:flex;
  align-items:center;
  padding:0 8px;
  cursor:pointer;
  position:relative;
  border:0.5px solid transparent;
  transition:border-color 0.1s;
}
.score-bar.red-bar{
  background:var(--red-light);
  border-color:var(--red-border);
}
.score-bar.blue-bar{
  background:var(--blue-light);
  border-color:var(--blue-border);
  justify-content:flex-end;
}
.score-bar.empty{
  background:var(--bg);
  border-color:var(--border);
}
.score-bar.empty.blue-bar{justify-content:flex-end;}
.score-num{
  font-size:13px;
  font-weight:500;
}
.score-bar.red-bar .score-num{color:var(--red);}
.score-bar.blue-bar .score-num{color:var(--blue);}
.score-bar.empty .score-num{color:var(--text-muted);}

.score-picker{
  position:absolute;
  top:calc(100% + 4px);
  background:#fff;
  border:0.5px solid var(--border);
  border-radius:6px;
  box-shadow:0 4px 16px rgba(0,0,0,0.08);
  z-index:100;
  display:none;
  flex-direction:column;
  overflow:hidden;
  min-width:52px;
}
.score-picker.red-picker{left:0;}
.score-picker.blue-picker{right:0;}
.score-picker.open{display:flex;}
.picker-opt{
  font-family:'DM Sans',sans-serif;
  font-size:13px;
  font-weight:500;
  padding:7px 14px;
  cursor:pointer;
  border:none;
  background:transparent;
  text-align:center;
  transition:background 0.1s;
}
.picker-opt:hover{background:var(--bg);}
.picker-opt.selected-r{color:var(--red);}
.picker-opt.selected-b{color:var(--blue);}

.sep-dot{
  width:6px;height:6px;
  border-radius:50%;
  background:var(--border);
  margin:0 auto;
}

.sc-footer{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  background:#111;
  padding:12px 14px;
  align-items:center;
}
.sc-tot-r{
  font-family:'Bebas Neue',sans-serif;
  font-size:32px;
  color:var(--red);
  letter-spacing:0.04em;
}
.sc-tot-b{
  font-family:'Bebas Neue',sans-serif;
  font-size:32px;
  color:#2e86c1;
  text-align:right;
  letter-spacing:0.04em;
}
.sc-tot-mid{
  font-size:8px;
  color:#444;
  text-align:center;
  letter-spacing:0.1em;
  text-transform:uppercase;
  line-height:1.6;
  padding:0 8px;
}

.leader-bar{
  max-width:520px;
  margin:0.8rem auto 0;
  font-size:12px;
  color:var(--text-muted);
  text-align:center;
  min-height:18px;
  font-weight:500;
}
.leader-bar span.r{color:var(--red);}
.leader-bar span.b{color:var(--blue);}

.share-wrap{
  max-width:520px;
  margin:1.2rem auto 0;
}
.share-btn{
  width:100%;
  font-family:'Bebas Neue',sans-serif;
  font-size:18px;
  letter-spacing:0.12em;
  padding:14px;
  background:#111;
  color:#fff;
  border:none;
  border-radius:var(--radius);
  cursor:pointer;
  transition:background 0.15s,transform 0.1s;
}
.share-btn:hover{background:#222;}
.share-btn:active{transform:scale(0.99);}
.share-btn:disabled{background:var(--border);color:var(--text-muted);cursor:not-allowed;}

.reset-btn{
  width:100%;
  font-family:'DM Sans',sans-serif;
  font-size:12px;
  font-weight:500;
  letter-spacing:0.06em;
  padding:10px;
  background:transparent;
  color:var(--text-muted);
  border:0.5px solid var(--border);
  border-radius:var(--radius);
  cursor:pointer;
  margin-top:8px;
  transition:all 0.15s;
}
.reset-btn:hover{border-color:var(--text-muted);color:var(--text);}

/* Share modal */
.modal-overlay{
  display:none;
  position:fixed;inset:0;
  background:rgba(0,0,0,0.6);
  z-index:200;
  align-items:center;
  justify-content:center;
  padding:1rem;
}
.modal-overlay.open{display:flex;}
.modal{
  background:#fff;
  border-radius:var(--radius);
  width:100%;
  max-width:400px;
  overflow:hidden;
}
.modal-preview{
  padding:1.2rem;
  background:var(--bg);
  border-bottom:0.5px solid var(--border);
}
.preview-card{
  background:#fff;
  border:0.5px solid var(--border);
  border-radius:8px;
  overflow:hidden;
  font-family:'DM Sans',sans-serif;
}
.preview-header{
  display:grid;
  grid-template-columns:1fr 52px 1fr;
  background:#111;
}
.preview-fighter{padding:10px 12px;}
.preview-fighter.r{border-right:2px solid var(--red);}
.preview-fighter.b{border-left:2px solid var(--blue);text-align:right;}
.preview-corner{font-size:8px;color:#555;text-transform:uppercase;letter-spacing:0.08em;}
.preview-name{font-size:12px;font-weight:500;color:#fff;margin-top:2px;font-family:'Bebas Neue',sans-serif;letter-spacing:0.06em;}
.preview-mid{display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0a0a0a;padding:4px;}
.preview-mid-brand{font-family:'Bebas Neue',sans-serif;font-size:11px;color:#fff;letter-spacing:0.06em;}
.preview-rounds{padding:4px 8px;}
.preview-round{display:grid;grid-template-columns:24px 1fr 6px 1fr;gap:3px;align-items:center;margin-bottom:2px;}
.preview-rn{font-size:9px;color:var(--text-muted);text-align:center;}
.preview-bar-r{height:16px;background:var(--red-light);border:0.5px solid var(--red-border);border-radius:3px;display:flex;align-items:center;padding:0 5px;}
.preview-bar-b{height:16px;background:var(--blue-light);border:0.5px solid var(--blue-border);border-radius:3px;display:flex;align-items:center;justify-content:flex-end;padding:0 5px;}
.preview-bar-r span,.preview-bar-b span{font-size:9px;font-weight:500;}
.preview-bar-r span{color:var(--red);}
.preview-bar-b span{color:var(--blue);}
.preview-sep{width:4px;height:4px;border-radius:50%;background:var(--border);margin:0 auto;}
.preview-footer{display:grid;grid-template-columns:1fr auto 1fr;background:#111;padding:8px 10px;align-items:center;}
.preview-tot-r{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--red);}
.preview-tot-b{font-family:'Bebas Neue',sans-serif;font-size:22px;color:#2e86c1;text-align:right;}
.preview-tot-m{font-size:7px;color:#444;text-align:center;letter-spacing:0.1em;line-height:1.6;}
.preview-brand-footer{background:#0a0a0a;padding:5px;text-align:center;font-size:8px;color:#333;letter-spacing:0.15em;font-family:'DM Sans',sans-serif;}

.modal-actions{padding:1rem;}
.modal-title{font-size:13px;font-weight:500;color:var(--text);margin-bottom:0.8rem;}
.copy-btn{
  width:100%;
  font-family:'DM Sans',sans-serif;
  font-size:13px;
  font-weight:500;
  padding:11px;
  background:#111;
  color:#fff;
  border:none;
  border-radius:6px;
  cursor:pointer;
  margin-bottom:6px;
  transition:background 0.15s;
}
.copy-btn:hover{background:#333;}
.close-btn{
  width:100%;
  font-family:'DM Sans',sans-serif;
  font-size:12px;
  font-weight:500;
  padding:10px;
  background:transparent;
  color:var(--text-muted);
  border:0.5px solid var(--border);
  border-radius:6px;
  cursor:pointer;
  transition:all 0.15s;
}
.close-btn:hover{border-color:var(--text-muted);}

@media(max-width:400px){
  .sc-name{font-size:12px;}
  .fighters-grid{grid-template-columns:1fr 24px 1fr;}
  .vs-badge{font-size:13px;}
}
</style>
</head>
<body>

<div class="lang-bar">
  <button class="lang-btn active" onclick="setLang('en')">EN</button>
  <button class="lang-btn" onclick="setLang('uk')">UA</button>
</div>

<div class="site-brand">
  <div class="site-brand-name">Boxing 12×3</div>
  <div class="site-brand-sub" id="lbl-subtitle">Scorecard</div>
</div>

<div class="setup-card">
  <div class="setup-title" id="lbl-setup">Fight</div>
  <div class="fighters-grid">
    <div class="fighter-input-wrap">
      <div class="fighter-label"><span class="dot-red"></span> <span id="lbl-red">Red corner</span></div>
      <input class="fighter-input" id="redName" type="text" placeholder="Fighter name" oninput="updateNames()">
    </div>
    <div class="vs-badge">VS</div>
    <div class="fighter-input-wrap">
      <div class="fighter-label"><span class="dot-blue"></span> <span id="lbl-blue">Blue corner</span></div>
      <input class="fighter-input" id="blueName" type="text" placeholder="Fighter name" oninput="updateNames()">
    </div>
  </div>
</div>

<div class="scorecard">
  <div class="sc-header">
    <div class="sc-fighter red">
      <div class="sc-corner" id="hdr-red">Red corner</div>
      <div class="sc-name" id="hdr-redname">—</div>
    </div>
    <div class="sc-mid">
      <div class="sc-mid-brand">12×3</div>
      <div class="sc-mid-sub">SCORE</div>
    </div>
    <div class="sc-fighter blue">
      <div class="sc-corner" id="hdr-blue">Blue corner</div>
      <div class="sc-name" id="hdr-bluename">—</div>
    </div>
  </div>

  <div class="sc-col-heads">
    <div class="sc-col-head r" id="lbl-win">WIN</div>
    <div class="sc-col-head" style="text-align:left" id="lbl-pts">PTS</div>
    <div class="sc-col-head">RD</div>
    <div class="sc-col-head" style="text-align:right" id="lbl-pts2">PTS</div>
    <div class="sc-col-head b" id="lbl-win2">WIN</div>
  </div>

  <div class="rounds-list" id="roundsList"></div>

  <div class="sc-footer">
    <div class="sc-tot-r" id="totRed">—</div>
    <div class="sc-tot-mid" id="lbl-total">TOTAL<br>SCORE</div>
    <div class="sc-tot-b" id="totBlue">—</div>
  </div>
</div>

<div class="leader-bar" id="leaderBar"></div>

<div class="share-wrap">
  <button class="share-btn" id="shareBtn" onclick="openShare()" disabled id="lbl-share">SHARE SCORECARD</button>
  <button class="reset-btn" onclick="resetAll()" id="lbl-reset">Reset</button>
</div>

<div class="modal-overlay" id="modal" onclick="closeShareOutside(event)">
  <div class="modal">
    <div class="modal-preview">
      <div class="preview-card" id="previewCard"></div>
    </div>
    <div class="modal-actions">
      <div class="modal-title" id="lbl-modal-title">Copy scorecard text to share</div>
      <button class="copy-btn" onclick="copyText()" id="lbl-copy">📋 Copy text</button>
      <button class="close-btn" onclick="closeShare()" id="lbl-close">Close</button>
    </div>
  </div>
</div>

<script>
const ROUNDS = 12;
const scores = Array.from({length:ROUNDS},()=>({red:null,blue:null}));
let lang = 'en';

const i18n = {
  en:{
    subtitle:'Scorecard',
    setup:'Fight',
    red:'Red corner',
    blue:'Blue corner',
    win:'WIN',
    pts:'PTS',
    total:'TOTAL\nSCORE',
    share:'SHARE SCORECARD',
    reset:'Reset',
    modalTitle:'Copy scorecard text to share',
    copy:'📋 Copy text',
    close:'Close',
    rdPlaceholder:'—',
    leadsBy:(name,diff)=>`${name} leads by ${diff} pts`,
    draw:'Even score',
    copied:'✓ Copied!',
    scored:'rounds scored',
    site:'boxing12x3.com',
  },
  uk:{
    subtitle:'Суддівська картка',
    setup:'Бій',
    red:'Червоний кут',
    blue:'Синій кут',
    win:'РАУНД',
    pts:'БАЛИ',
    total:'РАХУНОК',
    share:'ПОДІЛИТИСЬ КАРТКОЮ',
    reset:'Скинути',
    modalTitle:'Скопіюй текст і поділись',
    copy:'📋 Скопіювати',
    close:'Закрити',
    rdPlaceholder:'—',
    leadsBy:(name,diff)=>`${name} попереду на ${diff} балів`,
    draw:'Рівний рахунок',
    copied:'✓ Скопійовано!',
    scored:'раундів проставлено',
    site:'boxing12x3.com',
  }
};

function t(key,...args){
  const v=i18n[lang][key];
  return typeof v==='function'?v(...args):v;
}

function setLang(l){
  lang=l;
  document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('active',b.textContent===l.toUpperCase()));
  updateLabels();
  buildRounds();
  updateTotals();
}

function updateLabels(){
  document.getElementById('lbl-subtitle').textContent=t('subtitle');
  document.getElementById('lbl-setup').textContent=t('setup');
  document.getElementById('lbl-red').textContent=t('red');
  document.getElementById('lbl-blue').textContent=t('blue');
  document.getElementById('hdr-red').textContent=t('red');
  document.getElementById('hdr-blue').textContent=t('blue');
  document.getElementById('lbl-win').textContent=t('win');
  document.getElementById('lbl-win2').textContent=t('win');
  document.getElementById('lbl-pts').textContent=t('pts');
  document.getElementById('lbl-pts2').textContent=t('pts');
  document.getElementById('lbl-total').innerHTML=t('total').replace('\n','<br>');
  document.getElementById('shareBtn').textContent=t('share');
  document.querySelector('.reset-btn').textContent=t('reset');
  document.getElementById('lbl-modal-title').textContent=t('modalTitle');
  document.getElementById('lbl-copy').textContent=t('copy');
  document.getElementById('lbl-close').textContent=t('close');
  document.getElementById('redName').placeholder=lang==='uk'?"Ім'я бійця":"Fighter name";
  document.getElementById('blueName').placeholder=lang==='uk'?"Ім'я бійця":"Fighter name";
  updateNames();
}

function updateNames(){
  const r=document.getElementById('redName').value||'—';
  const b=document.getElementById('blueName').value||'—';
  document.getElementById('hdr-redname').textContent=r;
  document.getElementById('hdr-bluename').textContent=b;
  updateTotals();
}

function buildRounds(){
  const list=document.getElementById('roundsList');
  list.innerHTML='';
  for(let i=0;i<ROUNDS;i++){
    const sc=scores[i];
    const row=document.createElement('div');
    row.className='round-row'+(sc.red!==null&&sc.blue!==null?' scored':'');
    row.innerHTML=`
      <div class="win-indicator ${winClass(sc,true)}">${winLabel(sc,true)}</div>
      <div class="score-select-wrap">
        <div class="score-bar ${sc.red!==null?'red-bar':'empty'}" onclick="togglePicker(event,${i},'red')">
          <span class="score-num">${sc.red!==null?sc.red:'—'}</span>
        </div>
        <div class="score-picker red-picker ${i===openPicker?.round&&openPicker?.side==='red'?'open':''}" id="picker-${i}-red">
          ${[10,9,8,7,6].map(v=>`<button class="picker-opt${sc.red===v?' selected-r':''}" onclick="setScore(event,${i},'red',${v})">${v}</button>`).join('')}
        </div>
      </div>
      <div class="sep-dot"></div>
      <div class="score-select-wrap">
        <div class="score-bar ${sc.blue!==null?'blue-bar':'empty'}" onclick="togglePicker(event,${i},'blue')">
          <span class="score-num">${sc.blue!==null?sc.blue:'—'}</span>
        </div>
        <div class="score-picker blue-picker ${i===openPicker?.round&&openPicker?.side==='blue'?'open':''}" id="picker-${i}-blue">
          ${[10,9,8,7,6].map(v=>`<button class="picker-opt${sc.blue===v?' selected-b':''}" onclick="setScore(event,${i},'blue',${v})">${v}</button>`).join('')}
        </div>
      </div>
      <div class="win-indicator ${winClass(sc,false)}" style="text-align:right">${winLabel(sc,false)}</div>
    `;
    list.appendChild(row);
  }
}

function winClass(sc,isRed){
  if(sc.red===null||sc.blue===null) return '';
  if(sc.red===sc.blue) return 'draw';
  return isRed?(sc.red>sc.blue?'r':''):(sc.blue>sc.red?'b':'');
}

function winLabel(sc,isRed){
  if(sc.red===null||sc.blue===null) return '';
  if(sc.red===sc.blue) return lang==='uk'?'НР':'D';
  if(isRed) return sc.red>sc.blue?(lang==='uk'?'W':'W'):'';
  return sc.blue>sc.red?(lang==='uk'?'W':'W'):'';
}

let openPicker=null;
function togglePicker(e,round,side){
  e.stopPropagation();
  if(openPicker&&(openPicker.round!==round||openPicker.side!==side)){
    closePickers();
  }
  const picker=document.getElementById(`picker-${round}-${side}`);
  const isOpen=picker.classList.contains('open');
  closePickers();
  if(!isOpen){
    picker.classList.add('open');
    openPicker={round,side};
  }
}

function closePickers(){
  document.querySelectorAll('.score-picker').forEach(p=>p.classList.remove('open'));
  openPicker=null;
}

document.addEventListener('click',()=>closePickers());

function setScore(e,round,side,val){
  e.stopPropagation();
  scores[round][side]=val;
  closePickers();
  buildRounds();
  updateTotals();
}

function updateTotals(){
  const scored=scores.filter(s=>s.red!==null&&s.blue!==null);
  const tr=scored.reduce((a,s)=>a+s.red,0);
  const tb=scored.reduce((a,s)=>a+s.blue,0);
  document.getElementById('totRed').textContent=scored.length?tr:'—';
  document.getElementById('totBlue').textContent=scored.length?tb:'—';

  const lb=document.getElementById('leaderBar');
  const redName=document.getElementById('redName').value||t('red');
  const blueName=document.getElementById('blueName').value||t('blue');
  if(!scored.length){lb.innerHTML='';return;}
  const diff=Math.abs(tr-tb);
  if(tr===tb){lb.innerHTML=`<span>${t('draw')}</span>`;}
  else if(tr>tb){lb.innerHTML=`<span class="r">${t('leadsBy',redName,diff)}</span>`;}
  else{lb.innerHTML=`<span class="b">${t('leadsBy',blueName,diff)}</span>`;}

  const allScored=scores.every(s=>s.red!==null&&s.blue!==null);
  document.getElementById('shareBtn').disabled=!allScored;
}

function resetAll(){
  for(let i=0;i<ROUNDS;i++){scores[i]={red:null,blue:null};}
  buildRounds();
  updateTotals();
}

function openShare(){
  buildPreview();
  document.getElementById('modal').classList.add('open');
}
function closeShare(){document.getElementById('modal').classList.remove('open');}
function closeShareOutside(e){if(e.target===document.getElementById('modal'))closeShare();}

function buildPreview(){
  const rn=document.getElementById('redName').value||(lang==='uk'?t('red'):'Red corner');
  const bn=document.getElementById('blueName').value||(lang==='uk'?t('blue'):'Blue corner');
  const scored=scores.filter(s=>s.red!==null&&s.blue!==null);
  const tr=scored.reduce((a,s)=>a+s.red,0);
  const tb=scored.reduce((a,s)=>a+s.blue,0);
  const showRounds=scores.slice(0,12);
  const rows=showRounds.map((s,i)=>`
    <div class="preview-round">
      <div class="preview-rn">R${i+1}</div>
      <div class="preview-bar-r"><span>${s.red!==null?s.red:'—'}</span></div>
      <div class="preview-sep"></div>
      <div class="preview-bar-b"><span>${s.blue!==null?s.blue:'—'}</span></div>
    </div>
  `).join('');
  document.getElementById('previewCard').innerHTML=`
    <div class="preview-header">
      <div class="preview-fighter r">
        <div class="preview-corner">${t('red')}</div>
        <div class="preview-name">${rn}</div>
      </div>
      <div class="preview-mid"><div class="preview-mid-brand">12×3</div></div>
      <div class="preview-fighter b">
        <div class="preview-corner">${t('blue')}</div>
        <div class="preview-name">${bn}</div>
      </div>
    </div>
    <div class="preview-rounds">${rows}</div>
    <div class="preview-footer">
      <div class="preview-tot-r">${tr||'—'}</div>
      <div class="preview-tot-m">TOTAL<br>SCORE</div>
      <div class="preview-tot-b">${tb||'—'}</div>
    </div>
    <div class="preview-brand-footer">BOXING12X3.COM</div>
  `;
}

function copyText(){
  const rn=document.getElementById('redName').value||t('red');
  const bn=document.getElementById('blueName').value||t('blue');
  const tr=scores.reduce((a,s)=>a+(s.red||0),0);
  const tb=scores.reduce((a,s)=>a+(s.blue||0),0);
  let text=`🥊 ${rn} vs ${bn}\n`;
  text+=`${lang==='uk'?'Моя суддівська картка':'My scorecard'} — boxing12x3.com\n\n`;
  scores.forEach((s,i)=>{
    if(s.red!==null&&s.blue!==null){
      const w=s.red>s.blue?rn:s.blue>s.red?bn:'Draw';
      text+=`R${i+1}: ${s.red}–${s.blue} (${w})\n`;
    }
  });
  text+=`\n${lang==='uk'?'Разом':'Total'}: ${tr}–${tb}`;
  if(tr>tb)text+=` → ${rn} ${lang==='uk'?'виграє':'wins'}`;
  else if(tb>tr)text+=` → ${bn} ${lang==='uk'?'виграє':'wins'}`;
  else text+=` → ${lang==='uk'?'Нічия':'Draw'}`;
  navigator.clipboard.writeText(text).then(()=>{
    const btn=document.querySelector('.copy-btn');
    const orig=btn.textContent;
    btn.textContent=t('copied');
    setTimeout(()=>btn.textContent=orig,2000);
  });
}

buildRounds();
updateTotals();
updateLabels();
</script>
</body>
</html>
